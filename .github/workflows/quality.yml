name: Quality gates (manual runner preparation)

# No pull_request trigger: never execute untrusted fork code on self-hosted runners.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    # Provision a disposable, credential-free runner with this custom label first.
    runs-on: [self-hosted, Windows, X64, tutor-quality-isolated]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install locked dependencies
        shell: pwsh
        run: |
          uv sync --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location apps/admin_web
          npm ci
          $adminExit = $LASTEXITCODE
          Pop-Location
          if ($adminExit -ne 0) { exit $adminExit }
          Push-Location packages/contracts/dart
          & C:/src/flutter/bin/dart.bat pub get --enforce-lockfile
          $dartExit = $LASTEXITCODE
          Pop-Location
          if ($dartExit -ne 0) { exit $dartExit }
          Push-Location apps/flutter_student
          & C:/src/flutter/bin/flutter.bat pub get --enforce-lockfile
          $flutterExit = $LASTEXITCODE
          Pop-Location
          exit $flutterExit
      - name: Run gates and retain local report
        shell: pwsh
        run: |
          uv run --locked python tools/run_quality_gates.py --flutter C:/src/flutter/bin/flutter.bat --dart C:/src/flutter/bin/dart.bat
          exit $LASTEXITCODE
      # Reports stay on the isolated runner; no artifact publication or deployment.
