- key: math-quadratic-param-written
  subject: math
  type: solution
  answer_mode: written
  difficulty: 3
  grade: G10
  title: 含参二次函数的单调性与最值
  knowledge: [math.quadratic.graph, math.function.monotonicity]
  content:
    stem: '已知二次函数 $f(x)=x^2-2ax+3$（$a$ 为常数）。'
    subquestions:
      - {key: '1', stem: '若 $f(x)$ 在区间 $[1,+\infty)$ 上单调递增，求 $a$ 的取值范围；'}
      - {key: '2', stem: '当 $a=2$ 时，求 $f(x)$ 在区间 $[0,3]$ 上的最大值和最小值。'}
  answer:
    value:
      '1': '$a\le 1$，即 $(-\infty,1]$'
      '2': '最大值 $3$，最小值 $-1$'
  rubric:
    points:
      - {key: p1, part: '1', text: '指出图像开口向上，对称轴是直线 $x=a$（配方或用公式均可）'}
      - {key: p2, part: '1', text: '说明 $[1,+\infty)$ 要落在递增区间里，列出关于 $a$ 的不等式'}
      - {key: p3, part: '1', text: '得出 $a$ 的取值范围'}
      - {key: p4, part: '2', text: '代入 $a=2$ 并配方（或求顶点），判断对称轴在不在区间 $[0,3]$ 里'}
      - {key: p5, part: '2', text: '求出最小值，并写明在哪一点取得'}
      - {key: p6, part: '2', text: '比较区间两个端点处的函数值，得出最大值'}
      - {key: p7, part: null, text: '每一步写出依据，书写清楚'}
  teaching:
    concept: 二次函数的单调性与最值
    leak_markers:
      - 'a≤1'
      - 'a\le1'
      - 'a\leq1'
      - 'a<=1'
      - '(-∞,1]'
      - '(-\infty,1]'
      - '最大值为3'
      - '最大值是3'
      - '最大值3'
      - '最小值为-1'
      - '最小值是-1'
      - '最小值-1'
    hints:
      - '先看函数的形式：二次项系数是正数还是负数？图像开口朝哪一边？'
      - '第 (1) 问：先写出对称轴（含有 $a$ 的式子）。开口向上的抛物线，在对称轴的哪一侧递增？题目给的区间必须整个落在这一侧里。'
      - '第 (2) 问：先代入 $a$ 的值并配方，看对称轴在不在区间 $[0,3]$ 里。闭区间上的最值，要比较顶点处和区间端点处的函数值。'
    concept_rephrase: '二次函数 $y=(x-h)^2+k$ 的图像是一条抛物线：它在直线 $x=h$ 两侧是对称的，开口向上时，$x=h$ 左边一路下降、右边一路上升。所以问"在某个区间上单调"，就是问这个区间能不能整个放进对称轴的某一侧。'
  solutions:
    standard:
      steps:
        - '配方：$f(x)=x^2-2ax+3=(x-a)^2+3-a^2$，图像开口向上，对称轴为直线 $x=a$。'
        - '（1）开口向上时，$f(x)$ 在 $[a,+\infty)$ 上单调递增。要使 $f(x)$ 在 $[1,+\infty)$ 上单调递增，必须 $[1,+\infty)\subseteq[a,+\infty)$，即 $a\le 1$。'
        - '（2）当 $a=2$ 时，$f(x)=(x-2)^2-1$，对称轴 $x=2$ 在区间 $[0,3]$ 内，所以最小值是 $f(2)=-1$。'
        - '比较两个端点：$f(0)=3$，$f(3)=0$，所以最大值是 $f(0)=3$。'
      final_answer: '（1）$a\le 1$；（2）最大值 $3$，最小值 $-1$'
      key_points:
        - '闭区间上的最值要同时看顶点和端点'
        - '"在某区间上单调递增"是说这个区间整个落在递增区间里'

- key: phys-pull-friction-written
  subject: physics
  type: solution
  answer_mode: written
  difficulty: 3
  grade: G10
  title: 斜向上的拉力作用下的受力与加速度
  knowledge: [phys.force.decomposition, phys.friction, phys.newton.second]
  content:
    stem: '质量 $m=2\ \text{kg}$ 的物体静止在粗糙的水平地面上。现用一个与水平方向成 $37^\circ$ 角斜向上的拉力 $F=10\ \text{N}$ 拉它，物体沿地面滑动。已知物体与地面间的动摩擦因数 $\mu=0.5$，取 $g=10\ \text{m/s}^2$，$\sin37^\circ=0.6$，$\cos37^\circ=0.8$。'
    subquestions:
      - {key: '1', stem: '求地面对物体的支持力大小；'}
      - {key: '2', stem: '求物体的加速度大小。'}
  answer:
    value:
      '1': '$14\ \text{N}$'
      '2': '$0.5\ \text{m/s}^2$'
  rubric:
    points:
      - {key: p1, part: '1', text: '画出受力：重力、支持力、拉力、滑动摩擦力，并把拉力分解成水平和竖直两个分力'}
      - {key: p2, part: '1', text: '竖直方向合力为零，列出关于支持力的方程'}
      - {key: p3, part: '1', text: '求出支持力，带单位'}
      - {key: p4, part: '2', text: '用第 (1) 问求出的支持力计算滑动摩擦力，而不是直接用重力'}
      - {key: p5, part: '2', text: '水平方向用牛顿第二定律列式'}
      - {key: p6, part: '2', text: '求出加速度，带单位'}
  teaching:
    concept: 力的分解与牛顿第二定律
    leak_markers:
      - '14N'
      - 'N=14'
      - '0.5m/s'
      - 'a=0.5'
      - 'f=7'
      - '7N'
    hints:
      - '先画物体的受力图：除了重力和拉力，还有哪些力？别忘了把拉力沿水平和竖直两个方向分解。'
      - '竖直方向上物体没有加速度，合力为零。想一想：拉力有一部分在向上提它，这时地面的支持力还等于重力吗？'
      - '滑动摩擦力用 $f=\mu N$ 计算，这里的 $N$ 要用第 (1) 问的结果。水平方向再用牛顿第二定律列式。'
  solutions:
    standard:
      steps:
        - '（1）物体受四个力：重力 $mg$（竖直向下）、支持力 $N$（竖直向上）、拉力 $F$、滑动摩擦力 $f$（水平向左）。把拉力分解：水平分力 $F\cos37^\circ$，竖直分力 $F\sin37^\circ$。'
        - '竖直方向合力为零：$N+F\sin37^\circ=mg$，所以 $N=20-10\times0.6=14\ \text{N}$。'
        - '（2）滑动摩擦力 $f=\mu N=0.5\times14=7\ \text{N}$。'
        - '水平方向由牛顿第二定律：$F\cos37^\circ-f=ma$，即 $10\times0.8-7=2a$，解得 $a=0.5\ \text{m/s}^2$。'
      final_answer: '（1）$14\ \text{N}$；（2）$0.5\ \text{m/s}^2$'
      key_points:
        - '拉力斜向上时，支持力小于重力'
        - '摩擦力要用支持力计算，不能直接用重力'

- key: chem-ion-equation-written
  subject: chemistry
  type: solution
  answer_mode: written
  difficulty: 3
  grade: G10
  title: 书写离子方程式
  knowledge: [chem.ion.reaction]
  content:
    stem: '写出下列反应的离子方程式。'
    subquestions:
      - {key: '1', stem: '碳酸钙与稀盐酸反应；'}
      - {key: '2', stem: '氢氧化钡溶液与稀硫酸反应。'}
  answer:
    value:
      '1': '$\text{CaCO}_3+2\text{H}^+=\text{Ca}^{2+}+\text{H}_2\text{O}+\text{CO}_2\uparrow$'
      '2': '$\text{Ba}^{2+}+2\text{OH}^-+2\text{H}^++\text{SO}_4^{2-}=\text{BaSO}_4\downarrow+2\text{H}_2\text{O}$'
  rubric:
    points:
      - {key: p1, part: '1', text: '难溶的碳酸钙写化学式，没有拆成离子'}
      - {key: p2, part: '1', text: '盐酸拆成离子，两边相同的离子已经消去'}
      - {key: p3, part: '1', text: '产物写对，注明气体符号，方程式配平'}
      - {key: p4, part: '2', text: '生成的沉淀和水都写化学式，没有拆'}
      - {key: p5, part: '2', text: '各离子的个数比与物质的组成一致，没有随意约分'}
      - {key: p6, part: '2', text: '检查过方程式两边的原子个数和电荷总数都相等'}
  teaching:
    concept: 离子方程式的书写
    leak_markers:
      - 'CaCO_3+2H^+'
      - 'CaCO3+2H+'
      - '2H^++SO_4'
      - '2OH^-+2H^+'
      - 'BaSO_4\downarrow'
      - 'BaSO4'
    hints:
      - '离子方程式里，哪些物质要拆成离子，哪些要保留化学式？想一想沉淀、气体、水和弱电解质。'
      - '第 (1) 问：先判断反应物里谁难溶、谁是强酸；反应前后没有变化的离子，不用写进方程式。'
      - '第 (2) 问：两种生成物都不拆。写完以后检查：每种离子前的系数，是不是和氢氧化钡、硫酸各自的组成对得上？'
  solutions:
    standard:
      steps:
        - '（1）碳酸钙难溶，写化学式；盐酸是强酸，拆成 $\text{H}^+$ 和 $\text{Cl}^-$；氯化钙是可溶性盐，拆成 $\text{Ca}^{2+}$ 和 $\text{Cl}^-$；水和二氧化碳写化学式。'
        - '消去两边相同的 $\text{Cl}^-$ 并配平：$\text{CaCO}_3+2\text{H}^+=\text{Ca}^{2+}+\text{H}_2\text{O}+\text{CO}_2\uparrow$。'
        - '（2）氢氧化钡和硫酸都是强电解质，拆成离子；生成物硫酸钡难溶、水难电离，都写化学式。'
        - '参加反应的 $\text{OH}^-$ 与 $\text{H}^+$ 的个数比是 $2:2$，不能约成 $1:1$：$\text{Ba}^{2+}+2\text{OH}^-+2\text{H}^++\text{SO}_4^{2-}=\text{BaSO}_4\downarrow+2\text{H}_2\text{O}$。'
      final_answer: '（1）$\text{CaCO}_3+2\text{H}^+=\text{Ca}^{2+}+\text{H}_2\text{O}+\text{CO}_2\uparrow$；（2）$\text{Ba}^{2+}+2\text{OH}^-+2\text{H}^++\text{SO}_4^{2-}=\text{BaSO}_4\downarrow+2\text{H}_2\text{O}$'
      key_points:
        - '难溶物、气体、水写化学式，易溶的强电解质拆成离子'
        - '离子个数比要与物质的组成一致，不能随意约分'
