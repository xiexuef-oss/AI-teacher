        revoked_at: {type: [string, 'null'], format: date-time}
        created_at: {type: string, format: date-time}
    ExportParentAccessInvite:
      type: object
      additionalProperties: false
      required: [id, expires_at, redeemed_at, revoked_at, created_at]
      properties:
        id: {type: string, format: uuid}
        expires_at: {type: string, format: date-time}
        redeemed_at: {type: [string, 'null'], format: date-time}
        revoked_at: {type: [string, 'null'], format: date-time}
        created_at: {type: string, format: date-time}
    ExportParentAccessRecords:
      description: 本人现存的家长访问授权和邀请元数据；不含家长身份、邀请码或哈希。绑定重新授权覆盖旧时间，不能推定完整历史或法定监护关系；导出不恢复、不撤销授权。
      type: object
      additionalProperties: false
      required: [history_complete, links, invites]
      properties:
        history_complete: {type: boolean, enum: [false]}
        links:
          type: array
          items: {$ref: '#/components/schemas/ExportParentAccessLink'}
        invites:
          type: array
          items: {$ref: '#/components/schemas/ExportParentAccessInvite'}
    ExportStoredScan:
      description: 本人现存拍题文字快照；状态保留保存值，expires_at是原有效期。media_id只是原图引用，不保证图片存在或可读，不包含原图字节、存储路径或内部payload字段。
      type: object
      additionalProperties: false
      required: [media_id, expires_at, scan]
      properties:
        media_id: {type: string, format: uuid}
        expires_at: {type: string, format: date-time}
        scan: {$ref: '#/components/schemas/Scan'}
    StudentMediaExport:
      description: 当前可访问学生用途媒体档案；内含状态清单，明确排除过期/删除、审核用途及已清理历史。false标记不能改为完整历史或全局快照承诺。
      type: object
      additionalProperties: false
      required: [format_version, scope, owner_id, exported_at, history_complete, consistent_snapshot, objects_count, files_count, size_bytes, sha256, archive_base64]
      properties:
        format_version: {type: integer, enum: [1]}
        scope: {type: string, enum: [server_current_student_media]}
        owner_id: {type: string, format: uuid}
        exported_at: {type: string, format: date-time}
        history_complete: {type: boolean, enum: [false]}
        consistent_snapshot: {type: boolean, enum: [false]}
        objects_count: {type: integer, minimum: 0, maximum: 1000}
        files_count: {type: integer, minimum: 0, maximum: 1000}
        size_bytes: {type: integer, minimum: 1, maximum: 16777216}
        sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        archive_base64:
          description: ZIP的base64；其中manifest.json必须符合StudentMediaArchiveManifest，文件名只用受控UUID。
          type: string
          maxLength: 22369624
          contentEncoding: base64

    StudentMediaArchiveObject:
      type: object
      additionalProperties: false
      required: [media_id, purpose, mime, size_bytes, sha256, expires_at, state, file_name, availability]
      properties:
        media_id: {type: string, format: uuid}
        purpose: {type: string, enum: [ocr_source, handwriting]}
        mime: {type: [string, 'null'], maxLength: 256}
        size_bytes: {type: integer, minimum: 1, maximum: 16777216}
        sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        expires_at: {type: string, format: date-time}
        state: {type: string, enum: [reserved, pending, ready]}
        file_name:
          type: [string, 'null']
          maxLength: 47
          pattern: '^media/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\.(png|jpg|webp|bin)$'
        availability: {type: string, enum: [not_uploaded, awaiting_confirmation, included]}

    StudentMediaArchiveManifest:
      description: ZIP内自包含范围清单，不是完整历史或跨对象快照；未上传/待确认只列状态。
      type: object
      additionalProperties: false
      required: [format_version, scope, owner_id, exported_at, history_complete, consistent_snapshot, objects_count, files_count, objects, excluded]
      properties:
        format_version: {type: integer, enum: [1]}
        scope: {type: string, enum: [server_current_student_media]}
        owner_id: {type: string, format: uuid}
        exported_at: {type: string, format: date-time}
        history_complete: {type: boolean, enum: [false]}
        consistent_snapshot: {type: boolean, enum: [false]}
        objects_count: {type: integer, minimum: 0, maximum: 1000}
        files_count: {type: integer, minimum: 0, maximum: 1000}
        objects:
          type: array
          maxItems: 1000
          items: {$ref: '#/components/schemas/StudentMediaArchiveObject'}
        excluded:
          type: array
          items: {type: string, enum: [expired_or_deleted_media, reviewer_media, cleared_history, unsynced_device_images, credentials_and_storage_details]}

    ExportModelCall:
      type: object
      additionalProperties: false
      required: [created_at, task_type, status, provider_calls, input_tokens, output_tokens, image_units, estimated_cost_micros]
      properties:
        created_at: {type: string, format: date-time}
