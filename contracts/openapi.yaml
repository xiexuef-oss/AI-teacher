        source_revision: {type: integer, minimum: 0}
        answer:
          oneOf:
            - {$ref: '#/components/schemas/AnswerPayload'}
            - {type: 'null'}
        strokes:
          oneOf:
            - {$ref: '#/components/schemas/StrokeDoc'}
            - {type: 'null'}
    DraftCopy:
      type: object
