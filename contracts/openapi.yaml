          items: {type: string}
        boundary: {type: [string, 'null'], description: 快速解法不适用的情形；标准解法为 null。}
        reviewed: {type: boolean}
        reviewed_by: {type: [string, 'null'], format: uuid}
    AdminRegionTag:
      type: object
