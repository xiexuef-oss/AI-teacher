openapi: 3.1.0
info:
  title: AI 理科私教 API
  version: 1.3.0-slice.1
  summary: 高中数学、物理、化学 AI 私教的公开 API 契约（权威文件）
  description: |
    约定（docs/05）：

    - Base 为 `/api/v1`；JSON UTF-8；时间一律 UTC ISO-8601；资源 ID 为 UUID。
    - 成功响应 `{"data": ...}`；错误响应 `{"error": {"code", "message", "details", "request_id"}}`，不返回栈信息。
    - 每个响应回显 `X-Request-Id`；请求未带时由服务端生成。
    - 非幂等动作必须带 `Idempotency-Key`。同键同请求重放首次的响应（带 `Idempotency-Replayed: true`）；
      同键不同请求返回 409 `idempotency_key_conflict`；缺少时返回 400 `idempotency_key_required`。
    - 权限只来自 Bearer token 与持久授权。请求里的任何 student_id 都不是授权依据；访问他人资源返回 404。
    - 删除或重命名字段是破坏性变更；新增字段默认可选，客户端忽略未知字段。
    - 原型期：服务端开启本地身份 Mock 时只接受回环地址的请求，其他来源的任何请求都在进入具体操作之前
      被拦截，返回 403 `loopback_only`（错误信封相同）。这是部署形态的限制，不逐个操作声明。

    `x-implementation-status`：`implemented` 表示 ADR-006 本地纵向切片已实现；`planned` 表示只定了契约草案，
    服务端目前返回 501 `not_implemented`，形状在实现前仍可调整。

    教学事件（`TutorEvent`）的 payload 由 `contracts/tutor_event.schema.json` 约束，服务端下发前逐个校验。

    练习反馈不是官方阅卷分数。判定不了的作答返回 `uncertain`，不算对也不算错。
servers:
  - url: /api/v1
tags:
  - {name: system, description: 健康检查与启动配置}
  - {name: identity, description: 本地身份 Mock（仅原型期，须显式开启）}
  - {name: profile, description: 学生资料与地区设置}
  - {name: tasks, description: 今日任务}
  - {name: questions, description: 题目}
  - {name: sessions, description: 学习会话与教学事件}
  - {name: attempts, description: 作答、草稿与提交}
  - {name: tutor, description: 教学下一步}
  - {name: reviews, description: 间隔复测}
  - {name: progress, description: 学情}
  - {name: media, description: 媒体上传与拍题（planned）}
  - {name: parents, description: 家长周报与绑定授权：学生明确授权、可撤销；家长只看汇总}
  - {name: admin, description: 内容审核（reviewer / admin）：题目 draft → reviewed → published，可撤回}
security:
  - bearerAuth: []

paths:
  /health:
    get:
      operationId: getHealth
      tags: [system]
      summary: 服务健康状态与关键开关
      x-implementation-status: implemented
      security: []
      parameters:
        - {$ref: '#/components/parameters/RequestId'}
      responses:
        '200':
          description: 服务可用
          headers: {X-Request-Id: {$ref: '#/components/headers/RequestId'}}
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/Health'}

  /meta/launch-config:
    get:
      operationId: getLaunchConfig
      tags: [system]
      summary: 首发地区、年级、学科、教材选项与考试年份估算
      description: 引导页用。地区由用户手动选择，不根据定位推断；教材选项与省份无对应关系。
      x-implementation-status: implemented
      security: []
      parameters:
        - {$ref: '#/components/parameters/RequestId'}
      responses:
        '200':
          description: 启动配置
          headers: {X-Request-Id: {$ref: '#/components/headers/RequestId'}}
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/LaunchConfig'}

  /dev/local-identities:
    post:
      operationId: createLocalIdentity
      tags: [identity]
      summary: 创建一个本地身份并返回随机 bearer
      description: |
        仅当服务端显式开启本地身份 Mock（且环境为 local）时可用，并且只接受回环地址的请求。
        未开启时返回 404。token 只在本响应中出现一次，服务端只保存哈希。真实登录接口另行冻结（Q-03）。
        默认创建学生；`role=reviewer` / `role=admin` 用来在本机联调内容审核后台，真实环境的角色由身份服务决定。
      x-implementation-status: implemented
      security: []
      parameters:
        - {$ref: '#/components/parameters/RequestId'}
        - name: role
          in: query
          required: false
          schema: {$ref: '#/components/schemas/LocalRole'}
      responses:
        '201':
          description: 已创建
          headers: {X-Request-Id: {$ref: '#/components/headers/RequestId'}}
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/LocalIdentity'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}

  /profile:
    get:
      operationId: getProfile
      tags: [profile]
      summary: 当前学生的资料
      x-implementation-status: implemented
      parameters:
        - {$ref: '#/components/parameters/RequestId'}
      responses:
        '200':
          description: 学生资料；尚未完成引导时 onboarding_completed 为 false
          headers: {X-Request-Id: {$ref: '#/components/headers/RequestId'}}
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/StudentProfile'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    put:
      operationId: updateProfile
      tags: [profile]
      summary: 保存地区、年级、学科、考试年份与教材版本
      description: |
        整体替换可编辑字段。`exam_year` 省略或为 null 时：若此前由用户手动设置过则保留，否则按年级估算
        （学年以 9 月为起点）。教材版本可以为 null（暂不清楚）。切换地区不影响已产生的会话快照。
      x-implementation-status: implemented
      parameters:
        - {$ref: '#/components/parameters/RequestId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProfileUpdate'}
      responses:
        '200':
          description: 保存后的资料
          headers: {X-Request-Id: {$ref: '#/components/headers/RequestId'}}
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/StudentProfile'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/Unprocessable'}

  /tasks/today:
    get:
      operationId: getTodayTasks
      tags: [tasks]
      summary: 今日任务
      description: 没有可推荐内容时 items 为空数组。任务由服务端按到期复测、薄弱点、变式与资料即时计算。
      x-implementation-status: implemented
      parameters:
        - {$ref: '#/components/parameters/RequestId'}
      responses:
        '200':
          description: 今日任务
          headers: {X-Request-Id: {$ref: '#/components/headers/RequestId'}}
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/TodayTasks'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /questions:
    get:
      operationId: listQuestions
      tags: [questions]
      summary: 练习选题列表
      description: |
        只返回已发布且有使用许可的题目。`scope=region` 只要当前学生地区与考试年份适用的题；
        `scope=general` 只要全国通用基础题；默认 `all` 时地区适用题排在前面。
      x-implementation-status: implemented
      parameters:
        - {$ref: '#/components/parameters/RequestId'}
        - name: subject
          in: query
          schema: {$ref: '#/components/schemas/Subject'}
        - name: answer_mode
          in: query
          schema: {$ref: '#/components/schemas/AnswerMode'}
        - name: source_category
          in: query
          schema: {$ref: '#/components/schemas/SourceCategory'}
        - name: scope
          in: query
          schema: {$ref: '#/components/schemas/QuestionScope'}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: 一页题目
          headers: {X-Request-Id: {$ref: '#/components/headers/RequestId'}}
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/QuestionPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/Unprocessable'}

  /questions/{question_id}:
    get:
      operationId: getQuestion
      tags: [questions]
      summary: 题目与结构
      description: 不包含答案、解法、提示原文与选项分析。未发布的题对学生返回 404。
      x-implementation-status: implemented
      parameters:
        - {$ref: '#/components/parameters/RequestId'}
        - {$ref: '#/components/parameters/QuestionId'}
      responses:
        '200':
          description: 题目
          headers: {X-Request-Id: {$ref: '#/components/headers/RequestId'}}
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/Question'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}

  /sessions:
    post:
      operationId: createSession
      tags: [sessions]
      summary: 为一道题开启学习会话
      description: |
        会话保存题目版本以及当时的地区、考试年份、教材版本快照。`origin=review` 必须带已到期的
        `review_item_id`；复测会话在提交前不提供提示与解析。
      x-implementation-status: implemented
      parameters:
        - {$ref: '#/components/parameters/RequestId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SessionCreate'}
      responses:
        '201':
          description: 已创建
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
            Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/StudySession'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}

  /sessions/{session_id}:
    get:
      operationId: getSession
      tags: [sessions]
      summary: 会话当前状态
      x-implementation-status: implemented
      parameters:
        - {$ref: '#/components/parameters/RequestId'}
        - {$ref: '#/components/parameters/SessionId'}
      responses:
        '200':
          description: 会话
          headers: {X-Request-Id: {$ref: '#/components/headers/RequestId'}}
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/StudySession'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}

  /sessions/{session_id}/events:
    get:
      operationId: listSessionEvents
      tags: [sessions]
      summary: 按 seq 恢复教学事件
      x-implementation-status: implemented
      parameters:
        - {$ref: '#/components/parameters/RequestId'}
        - {$ref: '#/components/parameters/SessionId'}
        - name: after_seq
          in: query
          description: 只返回 seq_no 大于该值的事件。
          schema: {type: integer, minimum: 0, default: 0}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 200, default: 100}
      responses:
        '200':
          description: 事件列表，按 seq_no 升序
          headers: {X-Request-Id: {$ref: '#/components/headers/RequestId'}}
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/TutorEventPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}

  /attempts:
    post:
      operationId: createAttempt
      tags: [attempts]
      summary: 在会话中新建一次作答草稿
      description: 同一会话同时只能有一份未提交的作答；已存在时返回 409 `attempt_in_progress`，details.attempt_id 为它的 ID。
      x-implementation-status: implemented
      parameters:
        - {$ref: '#/components/parameters/RequestId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AttemptCreate'}
      responses:
        '201':
          description: 已创建
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
            Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/Attempt'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}

  /attempts/{attempt_id}:
    get:
      operationId: getAttempt
      tags: [attempts]
      summary: 一次作答及其评估
      x-implementation-status: implemented
      parameters:
        - {$ref: '#/components/parameters/RequestId'}
        - {$ref: '#/components/parameters/AttemptId'}
      responses:
        '200':
          description: 作答
          headers: {X-Request-Id: {$ref: '#/components/headers/RequestId'}}
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/Attempt'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}

  /attempts/{attempt_id}/draft:
    get:
      operationId: getDraft
      tags: [attempts]
      summary: 云端草稿（未提交的答案与笔迹）
      x-implementation-status: implemented
      parameters:
        - {$ref: '#/components/parameters/RequestId'}
        - {$ref: '#/components/parameters/AttemptId'}
      responses:
        '200':
          description: 草稿
          headers: {X-Request-Id: {$ref: '#/components/headers/RequestId'}}
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/Draft'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}
    put:
      operationId: syncDraft
      tags: [attempts]
      summary: 同步草稿
      description: |
        `base_revision` 必须等于服务端当前 revision，成功后 revision 加一。不相等返回 409
        `draft_revision_conflict`，details 带 `server_revision` 与 `server_draft`，服务端不覆盖任何一方。
        已提交的作答返回 409 `attempt_already_submitted`。请求体超过上限返回 413。
      x-implementation-status: implemented
      parameters:
        - {$ref: '#/components/parameters/RequestId'}
        - {$ref: '#/components/parameters/AttemptId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DraftSync'}
      responses:
        '200':
          description: 同步后的草稿
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
            Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/Draft'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422': {$ref: '#/components/responses/Unprocessable'}

  /attempts/{attempt_id}/submit:
    post:
      operationId: submitAttempt
      tags: [attempts]
      summary: 提交作答并返回评估状态
      description: |
        客观题同步判定。判定不了（例如填空等价性无法确认）时 `evaluation.state=uncertain`、`is_correct=null`。
        解答题（`written`）和实验题（`experiment`）不自动评分：返回 `state=pending`、`outcome=undetermined`、
        `is_correct=null`，并产生一条 `uncertainty` 事件（`reason_code=subjective_self_check`）；学生之后用
        `/attempts/{attempt_id}/self-check` 对照要点自查。解答题没有文字（`answer.parts` 全空）
        也没有已同步的笔迹时返回 422；实验题的 `answer.cells`（数据表里学生填的格子，只能是题目留空的）
        与 `answer.parts` 都没有内容、也没有笔迹时同样返回 422。
        同一幂等键重复提交只产生一次评估；已提交的作答换新键再提交返回 409。
        只有会话里第一次提交、且此前没有看过提示、图解或解析的作答才算 `independent=true`。
      x-implementation-status: implemented
      parameters:
        - {$ref: '#/components/parameters/RequestId'}
        - {$ref: '#/components/parameters/AttemptId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SubmitRequest'}
      responses:
        '200':
          description: 提交结果
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
            Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/SubmitResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}

  /attempts/{attempt_id}/self-check:
    get:
      operationId: getSelfCheck
      tags: [attempts]
      summary: 解答题、实验题提交后的对照自查：要点，以及已保存的自评
      description: |
        解答题和实验题不自动评分。提交之后，学生对照这份要点清单，给每一条标"做到了 / 做到一部分 / 没做到"。
        要点只在作答已提交之后才给：提交之前返回 409 `attempt_not_submitted`，独立作答阶段不泄题；
        实验题数据表里留空格子的参考值（`reference_cells`）同样只在提交之后才给。
        不是解答题或实验题的作答返回 409 `self_check_not_applicable`。还没有保存过自评时 `marks` 为空、`saved_at` 为 null。
        自查是学生自己做的记录，不是官方阅卷分数，也不计入任何正确率。
      x-implementation-status: implemented
      parameters:
        - {$ref: '#/components/parameters/RequestId'}
        - {$ref: '#/components/parameters/AttemptId'}
      responses:
        '200':
          description: 自查要点与已保存的自评
          headers: {X-Request-Id: {$ref: '#/components/headers/RequestId'}}
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/SelfCheck'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
    put:
      operationId: saveSelfCheck
      tags: [attempts]
      summary: 保存对照自查的结果
      description: |
        整体替换：每个要点必须恰好评一次，缺评、重复或不认识的要点返回 422。可以改过再保存。
        同一幂等键重放返回同一结果。作答没有提交、或不是解答题、实验题的情形与 GET 相同，返回 409。
      x-implementation-status: implemented
      parameters:
        - {$ref: '#/components/parameters/RequestId'}
        - {$ref: '#/components/parameters/AttemptId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SelfCheckSave'}
      responses:
        '200':
          description: 保存后的自查
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
            Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
