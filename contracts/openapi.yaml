        review_item:
          description: 答错或辅助答对时自动安排的复测项。
          oneOf:
            - {$ref: '#/components/schemas/ReviewItem'}
            - {type: 'null'}

    # ------------------------------------------------------------ 解答题、实验题、证明题自查
    SelfCheckLevel:
      type: string
      description: 学生对照一个要点的自评：done 做到了，partial 做到一部分，missed 没做到。
      enum: [done, partial, missed]
    ProofStage:
      type: string
      description: |
        参考证明里一步的角色，对应 docs/06 的"拆解前提、构造、关键变形、结论"。
        premise 前提（用了哪些已知条件）；construction 构造（引入辅助量、辅助线，或把式子改写成便于证明的形式）；
        reasoning 推理（一步一步推下去的关键步骤）；conclusion 结论（回到求证）。
      enum: [premise, construction, reasoning, conclusion]
    SelfCheckPoint:
      type: object
      additionalProperties: false
      description: 对照检查的一个要点。不带分值：这不是评分，只是一张自查清单。
      required: [key, part, text]
      properties:
        key: {type: string, minLength: 1, maxLength: 16}
        part:
          type: [string, 'null']
          description: |
            对应的部分：解答题是小问键；实验题是小问键或数据表键；证明题是证明阶段（ProofStage 的四个值之一）；
            null 表示对整份作答的要求。
        text: {type: string, maxLength: 200}
    ProofReferenceStep:
      type: object
      additionalProperties: false
      description: 参考证明里的一步。只在提交之后随自查给出，只是对照用的参考：证明的写法不止一种，它不参与任何判定。
      required: [stage, text, reason]
      properties:
        stage: {$ref: '#/components/schemas/ProofStage'}
        text: {type: string, maxLength: 1000}
        reason: {type: string, maxLength: 400}
    SelfCheckMark:
      type: object
      additionalProperties: false
      required: [point_key, level]
      properties:
        point_key: {type: string, minLength: 1, maxLength: 16}
        level: {$ref: '#/components/schemas/SelfCheckLevel'}
    SelfCheckSave:
      type: object
      additionalProperties: false
      required: [marks]
      properties:
        marks:
          type: array
          minItems: 1
          maxItems: 40
          items: {$ref: '#/components/schemas/SelfCheckMark'}
    SelfCheckSummary:
      type: object
      additionalProperties: false
      description: 各档要点的个数。只是计数，不折算成分数。
      required: [done, partial, missed, total]
      properties:
        done: {type: integer, minimum: 0}
        partial: {type: integer, minimum: 0}
        missed: {type: integer, minimum: 0}
        total: {type: integer, minimum: 0, description: 要点总数；还没保存自评时 done、partial、missed 都是 0。}
    SelfCheck:
      type: object
      additionalProperties: false
      required: [attempt_id, points, reference_cells, reference_steps, marks, summary, saved_at, disclaimer]
      properties:
        attempt_id: {type: string, format: uuid}
        points:
          type: array
          maxItems: 40
          items: {$ref: '#/components/schemas/SelfCheckPoint'}
        reference_cells:
          type: array
          maxItems: 200
          description: |
            实验题数据表里留空格子的参考值，让学生把自己填的数和它对照。只在提交之后给；
            它只是对照用的参考，不是评分，也不参与任何判定。解答题、证明题为空数组。
          items: {$ref: '#/components/schemas/AnswerCell'}
        reference_steps:
          type: array
          maxItems: 20
          description: |
            证明题的参考证明，让学生把自己写的证明和它对照。只在提交之后给；证明的写法不止一种，
            它只是对照用的参考，不是评分，也不参与任何判定。其他题型为空数组。
          items: {$ref: '#/components/schemas/ProofReferenceStep'}
        marks:
          type: array
          maxItems: 40
          description: 已保存的自评；还没保存过时为空数组。
          items: {$ref: '#/components/schemas/SelfCheckMark'}
        summary: {$ref: '#/components/schemas/SelfCheckSummary'}
        saved_at: {type: [string, 'null'], format: date-time}
        disclaimer: {type: string, description: 说明自查是学生自己的记录，不是官方阅卷分数。}

    # ------------------------------------------------------------ 教学
    TutorAction:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action: {$ref: '#/components/schemas/TutorActionType'}
        confirm_end_independent:
          type: boolean
          default: false
          description: 提交前查看解析时必须为 true，表示学生明确结束独立作答。
    TutorStep:
      type: object
      additionalProperties: false
      required: [session, events]
      properties:
        session: {$ref: '#/components/schemas/StudySession'}
        events:
          type: array
          items: {$ref: '#/components/schemas/TutorEvent'}
    ContentSpanRef:
      type: object
      additionalProperties: false
      description: 固定题版本白名单文本块的范围；Unicode codepoint左闭右开。摘要为完整原文UTF-8 SHA-256，不做归一化。服务端必须另验start < end及实际长度、权限和审核范围。
      required: [block_id, block_sha256, start, end]
      properties:
        block_id:
          type: string
          maxLength: 64
          pattern: '^(stem|subquestion:[1-9][0-9]{0,2}:stem|option:[1-9][0-9]{0,2}|subquestion:[1-9][0-9]{0,2}:option:[1-9][0-9]{0,2}|proof:given:[1-9][0-9]{0,2}|proof:claim|hint:[1-9][0-9]{0,2}|rephrase|solution:(standard|fast):(step:[1-9][0-9]{0,2}|final_answer|condition:[1-9][0-9]{0,2}|boundary|key_point:[1-9][0-9]{0,2})|visual:(caption|static_fallback)|rubric:point:[1-9][0-9]{0,2}|reference_cell:[1-9][0-9]{0,2}:[1-9][0-9]{0,2}:[1-9][0-9]{0,2}|reference_step:[1-9][0-9]{0,2}:(text|reason))$'
        block_sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
        start: {type: integer, minimum: 0, maximum: 3999}
        end: {type: integer, minimum: 1, maximum: 4000}
    ResolvedContentSpan:
      type: object
      additionalProperties: false
      description: 服务端在事件meta固定question_id/question_version下授权解析的快照。索引均为版本内原序1-based ordinal；不包含任意URL或原始文件定位。
      required: [block_id, block_sha256, start, end, block_text, label]
      properties:
        block_id:
          type: string
          maxLength: 64
          pattern: '^(stem|subquestion:[1-9][0-9]{0,2}:stem|option:[1-9][0-9]{0,2}|subquestion:[1-9][0-9]{0,2}:option:[1-9][0-9]{0,2}|proof:given:[1-9][0-9]{0,2}|proof:claim|hint:[1-9][0-9]{0,2}|rephrase|solution:(standard|fast):(step:[1-9][0-9]{0,2}|final_answer|condition:[1-9][0-9]{0,2}|boundary|key_point:[1-9][0-9]{0,2})|visual:(caption|static_fallback)|rubric:point:[1-9][0-9]{0,2}|reference_cell:[1-9][0-9]{0,2}:[1-9][0-9]{0,2}:[1-9][0-9]{0,2}|reference_step:[1-9][0-9]{0,2}:(text|reason))$'
        block_sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
        start: {type: integer, minimum: 0, maximum: 3999}
        end: {type: integer, minimum: 1, maximum: 4000}
        block_text: {type: string, minLength: 1, maxLength: 4000}
        label: {type: string, minLength: 1, maxLength: 120}
    TeachingReferenceLink:
      type: object
      additionalProperties: false
      required: [target_block_id, source_span, independent_safe]
      description: 随题版本独立审校的教学引用注记。independent_safe仅为声明，不能绕过内容可见性、整块防泄题和完整解析门控；编辑使摘要失效时必须清除或重审。
      properties:
        target_block_id:
          type: string
          maxLength: 64
          pattern: '^(hint:[1-9][0-9]{0,2}|rephrase|solution:(standard|fast):step:[1-9][0-9]{0,2}|visual:caption)$'
        source_span: {$ref: '#/components/schemas/ContentSpanRef'}
        independent_safe: {type: boolean}
    TutorEvent:
      type: object
      additionalProperties: false
      description: 教学事件信封。payload 的结构按 type 由 contracts/tutor_event.schema.json 约束。
      x-json-schema-file: tutor_event.schema.json
      required: [id, session_id, seq_no, type, created_at, state_after, payload, meta]
      properties:
        id: {type: string, format: uuid}
        session_id: {type: string, format: uuid}
        seq_no: {type: integer, minimum: 1}
        type: {$ref: '#/components/schemas/TutorEventType'}
        created_at: {type: string, format: date-time}
        state_after: {$ref: '#/components/schemas/SessionState'}
        payload: {$ref: '#/components/schemas/TutorEventPayload'}
        meta: {$ref: '#/components/schemas/TutorEventMeta'}
        references:
          type: array
          maxItems: 8
          uniqueItems: true
          items: {$ref: '#/components/schemas/ResolvedContentSpan'}
    TutorEventPayload:
      type: object
      description: 见 tutor_event.schema.json 的 $defs/*Payload。
      additionalProperties: true
    TutorEventMeta:
      type: object
      additionalProperties: false
      required: [schema_version, source, degraded, provider, model_id, prompt_version, question_id, question_version, trace_id, request_id]
      properties:
        schema_version: {type: string}
        source: {$ref: '#/components/schemas/TutorEventSource'}
        degraded: {type: boolean}
        provider: {type: [string, 'null']}
        model_id: {type: [string, 'null']}
        prompt_version: {type: [string, 'null']}
        question_id: {type: string, format: uuid}
        question_version: {type: integer, minimum: 1}
        trace_id: {type: [string, 'null']}
        request_id: {type: string}
    TutorEventPage:
      type: object
      additionalProperties: false
      required: [items, last_seq]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/TutorEvent'}
        last_seq: {type: integer, minimum: 0, description: 会话当前最大的 seq_no。}

