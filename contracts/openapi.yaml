        next_cursor: {type: [string, 'null']}
        status_counts: {$ref: '#/components/schemas/AdminStatusCounts'}
    AdminAnswer:
      type: object
      additionalProperties: false
      required: [value, equivalence_rules, units]
      properties:
        value:
          description: '选择题为选项键数组；填空题为 {空位键: 标准答案}；解答题为 {小问键: 参考答案文字}；实验题为 {小问键: 参考答案文字, "表键.行键.列键": 参考值}；证明题为 {steps: [{stage, text, reason}]}（参考证明），都只用于对照，不参与自动判定。'
        equivalence_rules:
          type: object
          description: 填空题每个空位的等价判定规则。
        units:
          type: object
          description: 填空题需要单位时的单位规则。
    AdminVisual:
      type: object
      additionalProperties: false
      required: [template_id, params, caption]
      properties:
        template_id: {type: string}
        params:
          type: object
          additionalProperties: {type: number}
        caption: {type: string}
    AdminTeaching:
      type: object
      additionalProperties: false
      required: [concept, hints, concept_rephrase, option_analysis, visual, leak_markers]
      properties:
        reference_links:
          type: array
          maxItems: 64
          uniqueItems: true
          items: {$ref: '#/components/schemas/TeachingReferenceLink'}
        concept: {type: [string, 'null'], maxLength: 200}
        hints:
          type: array
          maxItems: 8
          items: {type: string, maxLength: 4000}
        concept_rephrase: {type: [string, 'null'], maxLength: 4000}
        option_analysis:
          type: object
          description: 选择题每个选项的分析，键是选项键。
