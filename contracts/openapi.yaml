      tags: [parents]
      summary: 学生生成一次性的家长邀请码（学生明确授权的第一步）
      description: |
        必填expected_parent_invite_revision，旧无body客户端422明确升级；成功key先重放。
        新生成版本不符409 parent_invite_revision_conflict，不使当前邀请码失效。
        只有学生能调用。邀请码只在这个响应里出现一次，库里只存哈希；有效期见 `expires_at`（可配置，默认 24 小时），
        用过一次就作废。再生成一个，会让这个学生之前还没被使用的邀请码立刻失效。
        幂等记录不保存邀请码明文；有效邀请可同键重放。到期、使用、撤销或本地进程密钥变化后返回
        409 `invite_response_expired`，请使用新幂等键重新生成；固定配置密钥时重启仍可重放有效邀请。
        授权是学生自己做的、可以随时撤销（见 `revokeParentLink`）。这是原型阶段的授权方式：监护授权方案（Q-03）
        冻结之前，它不代表任何法定的监护人核验。
      x-implementation-status: implemented
      parameters:
        - {$ref: '#/components/parameters/RequestId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ParentInviteCreate'}
      responses:
        '408': {$ref: '#/components/responses/RequestTimeout'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '429': {$ref: '#/components/responses/HttpRateLimited'}
        '201':
          description: 新的邀请码
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
            Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/ParentInvite'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}

