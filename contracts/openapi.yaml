  /admin/questions/{question_id}/review:
    post:
      operationId: reviewQuestion
      tags: [admin]
      summary: 审核决策
      description: |
        状态流转 draft → reviewed → published → withdrawn（docs/07）：

        - `approve`：draft → reviewed。提交内容的人不能审自己的题（403 `self_review_forbidden`）；
          程序校验有问题时 422 `content_checks_failed`（`details.problems` 列出问题）；
          `solution_kinds` 里列出的解法被标记为已审核（缺省为标准解法）。没有列出的快速解法不会对学生可用。
        - `reject`：draft / reviewed → draft，必须写 `comment`；已审核的标记全部撤销。
        - `publish`：reviewed → published。再做一次程序校验；标准解法必须已审核。
        - `withdraw`：published → withdrawn，必须写 `comment`；学生立即看不到这道题。withdrawn 是终态。

        `expected_version` 是审核人看到的题目版本，与当前版本不一致时 409 `version_conflict`；
        状态不允许这个决策时 409 `invalid_transition`。每次决策写审计日志，同一个幂等键只生效一次。
      x-implementation-status: implemented
      parameters:
        - {$ref: '#/components/parameters/RequestId'}
        - {$ref: '#/components/parameters/QuestionId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReviewDecision'}
      responses:
        '408': {$ref: '#/components/responses/RequestTimeout'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '429': {$ref: '#/components/responses/HttpRateLimited'}
        '200':
          description: 审核后的状态
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
            Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/QuestionReviewState'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}

  /admin/question-reviews/batch:
    post:
      operationId: reviewQuestionBatch
      tags: [admin]
      summary: 逐题显式确认后的批量审核
      description: |
        仅 reviewer/admin。最多50题，题目ID不可重复，每题必须 confirmed=true。
        每题复用单题版本、状态、独立二审和内容校验；失败仅回滚该题。
        有界批次和幂等回执在同一事务提交；进程/数据库异常整批回滚，复用原键重试。
        成功响应同键重放；失败子集再次审核是新动作，使用新稳定幂等键。
        不提供自动二审后发布；每题发布必须由审核员另行明确确认。
      x-implementation-status: implemented
      parameters:
        - {$ref: '#/components/parameters/RequestId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReviewBatch'}
      responses:
        '408': {$ref: '#/components/responses/RequestTimeout'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '429': {$ref: '#/components/responses/HttpRateLimited'}
        '200':
          description: 逐题成功或失败，失败不撤销其他成功项
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
            Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/ReviewBatchResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 原型期为本地身份 Mock 发放的随机 token；真实登录方式待 Q-03 冻结。

  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: 客户端生成的请求 ID；未提供时由服务端生成。响应头原样回显。
      schema: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9._:-]+$'}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 每次用户动作固定一个键，重试时复用。
      schema: {type: string, minLength: 8, maxLength: 128, pattern: '^[A-Za-z0-9._:-]+$'}
    Cursor:
      name: cursor
      in: query
      required: false
      description: 上一页返回的 next_cursor，不透明字符串。
      schema: {type: string, minLength: 1, maxLength: 256}
    Limit:
      name: limit
      in: query
      required: false
      schema: {type: integer, minimum: 1, maximum: 50, default: 20}
    QuestionId:
      name: question_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    VersionNo:
      name: version
      in: path
      required: true
      description: 题目的版本号，从 1 开始。
      schema: {type: integer, minimum: 1}
    SessionId:
      name: session_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    AttemptId:
      name: attempt_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ReviewId:
      name: review_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ScanId:
      name: scan_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    StudentId:
      name: student_id
      in: path
      required: true
      description: 仅作为资源关联；是否可访问由 token 与绑定关系决定。
      schema: {type: string, format: uuid}
    LinkId:
      name: link_id
      in: path
      required: true
      description: 家长授权记录的 ID；只能撤销自己的。
      schema: {type: string, format: uuid}
    WeekStart:
      name: week_start
      in: query
      required: false
      description: 周报从哪一天开始；必须是周一，并且这一周已经开始。不带时是当前这一周。
      schema: {type: string, format: date}

  headers:
    RequestId:
      description: 请求 ID，服务端回显或生成。
      schema: {type: string}
    IdempotencyReplayed:
      description: 值为 true 表示本响应是同一幂等键的重放。
      schema: {type: string, enum: ['true']}

  responses:
    LearningPackPhotoOcrResponse:
      description: 识别任务和待确认候选，不写入作答或复测证据
      headers: {X-Request-Id: {$ref: '#/components/headers/RequestId'}}
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: {$ref: '#/components/schemas/LearningPackPhotoOcr'}
    LearningJobResponse:
      description: 学习任务公开状态
      headers: {X-Request-Id: {$ref: '#/components/headers/RequestId'}}
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: {$ref: '#/components/schemas/LearningJobStatus'}
    RequestTimeout:
      description: 已启用的通用请求体接收期限已到，业务动作尚未执行。
      headers: {X-Request-Id: {$ref: '#/components/headers/RequestId'}}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    HttpRateLimited:
      description: 通用窗口/并发额度不足，或限流依赖不可用；不透露账号、IP或资源存在性。
      headers:
        X-Request-Id: {$ref: '#/components/headers/RequestId'}
        Retry-After:
          description: 建议稍后重试的秒数，不代表剩余额度。
          schema: {type: integer, minimum: 1}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    BadRequest:
      description: 参数错误（如缺少 Idempotency-Key、游标无效）
      headers: {X-Request-Id: {$ref: '#/components/headers/RequestId'}}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    Unauthorized:
      description: 未认证或 token 无效
      headers: {X-Request-Id: {$ref: '#/components/headers/RequestId'}}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    Forbidden:
      description: 无权限：角色不对（学生调用审核接口、审核员调用学生接口），或违反了"提交者不能审自己的题"
      headers: {X-Request-Id: {$ref: '#/components/headers/RequestId'}}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    NotFound:
      description: 资源不存在，或不属于当前用户（防枚举）
      headers: {X-Request-Id: {$ref: '#/components/headers/RequestId'}}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    Conflict:
      description: 状态或版本冲突
      headers: {X-Request-Id: {$ref: '#/components/headers/RequestId'}}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    PayloadTooLarge:
      description: 载荷过大
      headers: {X-Request-Id: {$ref: '#/components/headers/RequestId'}}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    Unprocessable:
      description: 字段语义不合法
      headers: {X-Request-Id: {$ref: '#/components/headers/RequestId'}}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    NotImplemented:
      description: 契约已规划，本阶段未实现
      headers: {X-Request-Id: {$ref: '#/components/headers/RequestId'}}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    ServiceUnavailable:
      description: 模型或依赖服务不可用，且没有可用的降级内容
      headers: {X-Request-Id: {$ref: '#/components/headers/RequestId'}}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}

  schemas:
    # ------------------------------------------------------------ 通用
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: {$ref: '#/components/schemas/ErrorBody'}
    ErrorBody:
      type: object
      additionalProperties: false
      required: [code, message, details, request_id]
      properties:
        code:
          type: string
          description: |
            机器可读的错误码，例如 idempotency_key_required、idempotency_key_conflict、unauthenticated、
            forbidden、loopback_only、not_found、draft_revision_conflict、attempt_already_submitted、
            attempt_in_progress、independent_attempt_in_progress、hints_disabled_in_retest、invalid_state、
            review_not_due、attempt_not_verified、payload_too_large、validation_error、not_implemented、
            model_unavailable、storage_unavailable（存储不可用，保持原幂等键重试）、
            storage_conflict（条件写冲突，未覆盖已有对象）；内容审核另有 self_review_forbidden、version_conflict、invalid_transition、
            comment_required、content_checks_failed、solution_not_confirmed；修改题目另有 no_changes。
        message: {type: string}
        details: {$ref: '#/components/schemas/ErrorDetails'}
        request_id: {type: string}
    ErrorDetails:
      type: object
      description: 与错误码相关的结构化信息；没有时为空对象。
      additionalProperties: true

    DiagnosticRevision:
      type: object
      additionalProperties: false
      required: [expected_revision]
      properties:
        expected_revision: {type: integer, minimum: 0}
    DiagnosticCreate:
      type: object
      additionalProperties: false
      required: [subject, expected_revision, expected_profile_revision]
      properties:
        subject: {$ref: '#/components/schemas/Subject'}
        expected_revision: {type: integer, minimum: 0}
        expected_profile_revision: {type: integer, minimum: 0}
    DiagnosticScope:
      type: object
      additionalProperties: false
      required: [profile_revision, region_code, grade, exam_year, curriculum_version]
      properties:
        profile_revision: {type: integer, minimum: 0}
        region_code: {$ref: '#/components/schemas/RegionCode'}
        grade:
          oneOf:
            - {$ref: '#/components/schemas/Grade'}
            - {type: 'null'}
        exam_year: {type: [integer, 'null']}
        curriculum_version: {type: [string, 'null']}
    DiagnosticSubmission:
      type: object
      additionalProperties: false
      required: [attempt_id, independent, evaluation_state, is_correct]
      properties:
        attempt_id: {type: string, format: uuid}
        independent: {type: boolean}
        evaluation_state: {$ref: '#/components/schemas/EvaluationState'}
        is_correct: {type: [boolean, 'null']}
    DiagnosticItem:
      type: object
      additionalProperties: false
      required: [position, question, question_version, session_id, submission]
      properties:
        position: {type: integer, minimum: 1, maximum: 3}
        question: {$ref: '#/components/schemas/QuestionSummary'}
        question_version: {type: integer, minimum: 1}
        session_id: {type: [string, 'null'], format: uuid}
        submission:
          oneOf:
            - {$ref: '#/components/schemas/DiagnosticSubmission'}
            - {type: 'null'}
    DiagnosticSummary:
      type: object
      additionalProperties: false
      description: 仅关联会话首份提交的本轮计数；uncertain/pending不算对错。独立正确、独立不正确、借助提示和未确认四类互斥，总和等于submitted。不推算掌握度、分数或正确率。
      required: [submitted, independent_correct, independent_incorrect, assisted, unconfirmed]
      properties:
        submitted: {type: integer, minimum: 0, maximum: 3}
        independent_correct: {type: integer, minimum: 0, maximum: 3}
        independent_incorrect: {type: integer, minimum: 0, maximum: 3}
        assisted: {type: integer, minimum: 0, maximum: 3}
        unconfirmed: {type: integer, minimum: 0, maximum: 3}
    DiagnosticRun:
      type: object
      additionalProperties: false
      required: [id, subject, scope, status, items, summary, created_at, abandoned_at]
      properties:
        id: {type: string, format: uuid}
        subject: {$ref: '#/components/schemas/Subject'}
        scope: {$ref: '#/components/schemas/DiagnosticScope'}
        status: {type: string, enum: [active, completed, abandoned]}
        items:
          type: array
          minItems: 3
          maxItems: 3
          items: {$ref: '#/components/schemas/DiagnosticItem'}
        summary: {$ref: '#/components/schemas/DiagnosticSummary'}
        created_at: {type: string, format: date-time}
        abandoned_at: {type: [string, 'null'], format: date-time}
    DiagnosticHistoryPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          maxItems: 50
          items: {$ref: '#/components/schemas/DiagnosticRun'}
        next_cursor: {type: [string, 'null'], format: uuid}
    DiagnosticWorkspace:
      type: object
      additionalProperties: false
      required: [revision, run]
      properties:
        revision: {type: integer, minimum: 0}
        run:
          oneOf:
            - {$ref: '#/components/schemas/DiagnosticRun'}
            - {type: 'null'}

    RegionCode:
      type: string
      description: 首发地区：四川 CN-51、重庆 CN-50。
      enum: [CN-51, CN-50]
    Grade:
      type: string
      description: 高一 G10、高二 G11、高三 G12。
      enum: [G10, G11, G12]
    Subject:
      type: string
      enum: [math, physics, chemistry]
    ExamYearSource:
      type: string
      description: estimated 表示按年级推算，user 表示用户手动设置。
      enum: [estimated, user]
    QuestionType:
      type: string
      description: 题型（考试意义上的类别）。
      enum: [single_choice, multiple_choice, fill_blank, solution, proof, experiment, inference, process_flow, comprehensive]
    AnswerMode:
      type: string
      description: |
        作答区的渲染方式。single_choice、multiple_choice、fill 由服务端确定性判定；
        written（解答题）只保存作答，提交后给对照要点的自查，不自动评分；
        experiment（实验题）是带数据表和安全提示的主观题：数据表里留空的格子填在 `answer.cells`，
        文字作答填在 `answer.parts`，和解答题一样不自动评分、提交后对照要点和参考数据自查；
        proof（证明题）有"已知 / 求证"（`content.proof`），学生把证明写成一步一步（每一步带依据）填在 `answer.steps`，
        同样不自动评分、提交后对照参考证明和要点自查。
      enum: [single_choice, multiple_choice, fill, written, experiment, proof]
    SourceType:
      type: string
      enum: [self_authored, textbook_licensed, public_license, gaokao_licensed, ai_generated]
    SourceCategory:
      type: string
      description: 学生可见的筛选分类：高考真题、模拟题、基础母题、AI 生成变式。
      enum: [gaokao_real, mock_exam, foundation, ai_variant]
    QuestionScope:
      type: string
      enum: [all, region, general]
    ApplicabilityScope:
      type: string
      description: region 表示带有审核过的地区适用标记；general 表示全国通用基础题。
      enum: [region, general]
    TaskKind:
      type: string
      description: new_topic 新题（首次使用时为入门选题）；review_mistake 复习旧错题；retest 间隔复测；weak_point 薄弱点；variant 变式。
      enum: [new_topic, review_mistake, retest, weak_point, variant]
    SessionOrigin:
      type: string
      enum: [task, practice, review, variant]
    SessionState:
      type: string
      description: docs/06 教学状态机，与 tutor_event.schema.json 的 SessionState 一致。
      enum: [READY, INDEPENDENT_ATTEMPT, SUBMITTED, DIAGNOSED, HINTED, STANDARD, FAST, VISUAL, VARIANT, REVIEW_SCHEDULED, DONE, FALLBACK]
    AttemptStatus:
      type: string
      enum: [draft, submitted]
    EvaluationState:
      type: string
      description: verified 为确定判定；uncertain 为无法可靠判断（不给确定结论）；pending 为等待评分；error 为评分出错。
      enum: [pending, verified, uncertain, error]
    EvaluationOutcome:
      type: string
      enum: [correct, partially_correct, incorrect, undetermined]
    FeedbackCode:
      type: string
      enum: [correct, wrong_option, missed_options, value_incorrect, unit_missing, unit_mismatch, format_unrecognized, equivalence_unconfirmed]
    TutorActionType:
      type: string
      enum: [request_hint, request_standard, request_fast, request_visual, mark_understood, mark_confused]
    TutorEventType:
      type: string
      enum: [diagnosis, hint, standard, fast, visual, ask, notice, uncertainty, fallback]
    TutorEventSource:
      type: string
      enum: [reviewed_content, model, rule_engine]
    ReviewStatus:
      type: string
      enum: [scheduled, mastered, paused]
    ReviewResult:
      type: string
      enum: [passed, failed]
    ReviewScope:
      type: string
      enum: [due, all]

    # ------------------------------------------------------------ 系统
    Health:
      type: object
      additionalProperties: false
      required: [status, api_version, contract_version, environment, local_identity_mock, external_model_calls, server_time]
      properties:
        status: {type: string, enum: [ok]}
        api_version: {type: string}
        contract_version: {type: string}
        environment: {type: string}
        local_identity_mock: {type: boolean, description: 是否开启了本地身份 Mock。}
        external_model_calls: {type: boolean, description: 是否允许调用外部模型供应商。}
        server_time: {type: string, format: date-time}
    LaunchConfig:
      type: object
      additionalProperties: false
      required: [regions, grades, subjects, curriculum_versions, school_year_start_month, exam_year_min, exam_year_max]
      properties:
        regions:
          type: array
          items: {$ref: '#/components/schemas/RegionOption'}
        grades:
          type: array
          items: {$ref: '#/components/schemas/GradeOption'}
        subjects:
          type: array
          items: {$ref: '#/components/schemas/SubjectOption'}
        curriculum_versions:
          type: array
          description: 可手动选择的教材版本。列表与省份无对应关系；不清楚时资料里留空。
          items: {$ref: '#/components/schemas/CurriculumOption'}
        school_year_start_month: {type: integer, minimum: 1, maximum: 12}
        exam_year_min: {type: integer}
        exam_year_max: {type: integer}
    RegionOption:
      type: object
      additionalProperties: false
      required: [code, name]
      properties:
        code: {$ref: '#/components/schemas/RegionCode'}
        name: {type: string}
    GradeOption:
      type: object
      additionalProperties: false
      required: [code, name, estimated_exam_year]
      properties:
        code: {$ref: '#/components/schemas/Grade'}
        name: {type: string}
        estimated_exam_year: {type: integer, description: 按当前日期和 9 月学年起点估算的高考年份。}
    SubjectOption:
      type: object
      additionalProperties: false
      required: [code, name]
      properties:
        code: {$ref: '#/components/schemas/Subject'}
        name: {type: string}
    CurriculumOption:
      type: object
      additionalProperties: false
      required: [code, name]
      properties:
        code: {type: string, minLength: 1, maxLength: 32}
        name: {type: string}

    # ------------------------------------------------------------ 身份与资料
    LocalRole:
      type: string
      description: |
        本地身份 Mock 可以发放的角色；缺省为 student。parent 只是本地联调用的 Mock 角色：学生自己授权、可以撤销，
        不代表任何监护人核验——真实登录与监护授权方案（Q-03）冻结之前，这是唯一的家长身份来源。
      enum: [student, parent, reviewer, admin]
      default: student
    LocalIdentity:
      type: object
      additionalProperties: false
      required: [user_id, role, access_token, token_type]
      properties:
        user_id: {type: string, format: uuid}
        role: {$ref: '#/components/schemas/LocalRole'}
        access_token: {type: string, minLength: 32}
        token_type: {type: string, enum: [Bearer]}
    LearningPackPdf:
      type: object
      additionalProperties: false
      required: [revision, sha256, content_base64]
      properties:
        revision: {type: integer, minimum: 1}
        sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        content_base64: {type: string, contentEncoding: base64}

    PaperReviewSchedule:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/PaperReviewScheduleItem'}

    PaperReviewScheduleItem:
      type: object
      additionalProperties: false
      required: [knowledge_id, title, stage, due_on, estimated_anchor]
      properties:
        knowledge_id: {type: string, format: uuid}
        title: {type: string}
        stage: {type: integer, minimum: 0, maximum: 3}
        due_on: {type: string, format: date}
        estimated_anchor: {type: boolean}

    LearningPackHistory:
      type: object
      additionalProperties: false
      required: [ids]
      properties:
        ids:
          type: array
          maxItems: 50
          items: {type: string, format: uuid}
        next_cursor: {type: string, format: uuid}

    LearningPackItems:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/LearningPackItem'}

    LearningPackItem:
      type: object
      additionalProperties: false
      required: [revision, code, question_version_id]
      properties:
        revision: {type: integer, minimum: 1}
        code: {type: string, pattern: '^[0-9]{3}$'}
        question_version_id: {type: string, format: uuid}

    LearningPackShortages:
      type: object
      additionalProperties: false
      required: [math, physics, chemistry]
      properties:
        math: {type: integer, minimum: 0}
        physics: {type: integer, minimum: 0}
        chemistry: {type: integer, minimum: 0}

    LearningPackPageLocation:
      type: object
      additionalProperties: false
      required: [job_id, item]
      properties:
        job_id: {type: string, format: uuid}
        item: {$ref: '#/components/schemas/LearningPackItem'}

    LearningPackReturnRecord:
      type: object
      additionalProperties: false
      required: [item, transcript, confirmed_at]
      properties:
        transcript_revision: {type: integer, minimum: 0}
        item: {$ref: '#/components/schemas/LearningPackItem'}
        transcript: {type: string, minLength: 1, maxLength: 8000}
        confirmed_at: {type: string, format: date-time}

    LearningPackCorrection:
      type: object
      additionalProperties: false
      required: [expected_revision, transcript]
      properties:
        expected_revision: {type: integer, minimum: 0}
        transcript: {type: string, minLength: 1, maxLength: 8000, pattern: '\S'}

    LearningPackPhotoOcrRequest:
      type: object
      additionalProperties: false
      required: [photo_ids]
      properties:
        photo_ids:
          type: array
          minItems: 1
          maxItems: 10
          uniqueItems: true
          items: {type: string, format: uuid}

    LearningPackPhotoOcr:
      type: object
      additionalProperties: false
      required: [id, item, status, photo_ids]
      properties:
        id: {type: string, format: uuid}
        item: {$ref: '#/components/schemas/LearningPackItem'}
        status: {type: string, enum: [queued, running, retry_wait, needs_review, unavailable, failed, cancelled]}
        photo_ids:
          type: array
          maxItems: 10
          items: {type: string, format: uuid}
        candidate: {type: string, minLength: 1, maxLength: 8000}

    LearningPackReturnRequest:
      type: object
      additionalProperties: false
      required: [transcript]
      properties:
        transcript: {type: string, minLength: 1, maxLength: 8000, pattern: '\S'}
        completed_on: {type: string, format: date}
        independence: {type: string, enum: [independent, assisted, unknown]}
        photo_ids:
          description: 已上传的本人临时图片，顺序为纸笔作答页顺序。
          type: array
          maxItems: 10
          uniqueItems: true
          items: {type: string, format: uuid}

    LearningPackRequest:
      type: object
      additionalProperties: false
      required: [school_minutes]
      properties:
        school_minutes: {type: integer, minimum: 0, maximum: 10080}

    LearningJobStatus:
      type: object
      additionalProperties: false
      required: [id, status, attempts]
      properties:
        id: {type: string, format: uuid}
        status: {type: string, enum: [queued, running, retry_wait, succeeded, needs_review, failed, cancelled]}
        attempts: {type: integer, minimum: 0, maximum: 3}
        pack_result: {type: string, enum: [published, awaiting_return, insufficient_budget, no_learning_day, no_printable_item]}
        reviews:
          type: array
          items: {$ref: '#/components/schemas/PaperReviewPlanItem'}

    PaperReviewPlanItem:
      type: object
      additionalProperties: false
      required: [knowledge_id, title, original_due_on]
      properties:
        knowledge_id: {type: string, format: uuid}
        title: {type: string}
        original_due_on: {type: string, format: date}
        suggested_on: {type: [string, 'null'], format: date}
        deferred_reason:
          type: [string, 'null']
          enum: [no_learning_day, insufficient_budget, awaiting_return, no_printable_item, overdue_budget_cap, null]

    LearningSettings:
      type: object
      additionalProperties: false
      required: [mode, weekly_minutes, weekdays]
      properties:
        mode: {type: string, enum: [boarding, weekend, digital]}
        weekly_minutes: {type: integer, minimum: 0, maximum: 10080}
        weekdays:
          description: ISO 星期编号，星期一为 1。
          type: array
          uniqueItems: true
          items: {type: integer, minimum: 1, maximum: 7}
        school_progress: {type: string, maxLength: 500}
        exam_scope: {type: string, maxLength: 500}

    StudentProfile:
      type: object
      additionalProperties: false
      required:
        - user_id
        - display_name
        - region_code
        - grade
        - subjects
        - exam_year
        - exam_year_source
        - exam_scheme_code
        - curriculum_version
        - onboarding_completed
        - notices
        - updated_at
      properties:
        revision: {type: integer, minimum: 0, description: 单调递增的资料版本；新服务始终返回。旧缓存或旧响应缺失时表示未知，不能当作0。}
        learning_settings:
          oneOf:
            - {$ref: '#/components/schemas/LearningSettings'}
            - {type: 'null'}
        user_id: {type: string, format: uuid}
        display_name: {type: [string, 'null'], maxLength: 40}
        region_code:
          oneOf:
            - {$ref: '#/components/schemas/RegionCode'}
            - {type: 'null'}
        grade:
          oneOf:
            - {$ref: '#/components/schemas/Grade'}
            - {type: 'null'}
        subjects:
          type: array
          items: {$ref: '#/components/schemas/Subject'}
        exam_year: {type: [integer, 'null']}
        exam_year_source:
          oneOf:
            - {$ref: '#/components/schemas/ExamYearSource'}
            - {type: 'null'}
        exam_scheme_code:
          type: [string, 'null']
          description: 考试制度版本。地区规则审核生效前保持 null，不由代码硬编码。
        curriculum_version: {type: [string, 'null'], description: 教材版本；null 表示暂不清楚。}
        onboarding_completed: {type: boolean, description: 已选择地区和至少一门学科。}
        notices:
          type: array
          items: {$ref: '#/components/schemas/ProfileNotice'}
        updated_at: {type: string, format: date-time}
    ProfileNotice:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: {type: string, enum: [curriculum_unknown, grade_unknown, exam_year_estimated]}
        message: {type: string}
    ProfileUpdate:
      type: object
      additionalProperties: false
      required: [expected_revision, region_code, subjects]
      properties:
        learning_settings:
          description: 省略或 null 保留现有学习设置。
          oneOf:
            - {$ref: '#/components/schemas/LearningSettings'}
            - {type: 'null'}
        expected_revision: {type: integer, minimum: 0, description: 发起编辑时读取的资料版本，必填。}
        region_code: {$ref: '#/components/schemas/RegionCode'}
        subjects:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items: {$ref: '#/components/schemas/Subject'}
        grade:
          oneOf:
            - {$ref: '#/components/schemas/Grade'}
            - {type: 'null'}
        exam_year: {type: [integer, 'null'], description: 省略或 null 表示沿用手动值或按年级估算。}
        curriculum_version: {type: [string, 'null'], minLength: 1, maxLength: 32}
        display_name: {type: [string, 'null'], minLength: 1, maxLength: 40}

    # ------------------------------------------------------------ 任务与题目
    TodayTasks:
      type: object
      additionalProperties: false
      required: [date, items]
      properties:
        date: {type: string, format: date, description: 服务端 UTC 日期。}
        cold_start: {type: boolean, default: false, description: 尚未提交过作答或主动查看过解析；不代表能力档案或掌握度。旧响应可省略。}
        items:
          type: array
          items: {$ref: '#/components/schemas/StudyTask'}
    QuestionTopic:
      type: object
      additionalProperties: false
      required: [id, code, title, subject, question_count]
      properties:
        id: {type: string, format: uuid}
        code: {type: string}
        title: {type: string}
        subject: {$ref: '#/components/schemas/Subject'}
        question_count: {type: integer, minimum: 1}
    QuestionTopicPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/QuestionTopic'}
    StudyTask:
      type: object
      additionalProperties: false
      required: [id, kind, title, reason, subject, question_id, review_item_id, applicability, estimated_minutes]
      properties:
        id: {type: string, format: uuid, description: 同一学生同一天同一任务的 ID 稳定，可用于记录跳过。}
        kind: {$ref: '#/components/schemas/TaskKind'}
        title: {type: string}
        reason: {type: string, description: 为什么推荐这项任务。}
        subject: {$ref: '#/components/schemas/Subject'}
        question_id: {type: string, format: uuid}
        review_item_id: {type: [string, 'null'], format: uuid}
        applicability: {$ref: '#/components/schemas/Applicability'}
        estimated_minutes: {type: integer, minimum: 1}
    Applicability:
      type: object
      additionalProperties: false
      required: [scope, label, recommended_regions, origin_region_code, exam_year_from, exam_year_to, disclaimer]
      properties:
        scope: {$ref: '#/components/schemas/ApplicabilityScope'}
        label: {type: string, description: 展示给学生的来源适用性说明，例如"全国通用基础题"。}
        recommended_regions:
          type: array
          items: {$ref: '#/components/schemas/RegionCode'}
        origin_region_code: {type: [string, 'null'], description: 试题原始来源地区；自编题为 null。}
        exam_year_from: {type: [integer, 'null']}
        exam_year_to: {type: [integer, 'null']}
        disclaimer: {type: string}
    QuestionOriginLocation:
      type: object
      additionalProperties: false
      description: 导入时校验归属及页序后的来源位置声明；不含原文、预览或文件访问凭据，不承诺精确文本对应。
      required: [file_sha256, file_kind, locator_kind, index, declared_block]
      properties:
        file_sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
        file_kind: {$ref: '#/components/schemas/DocImportFileKind'}
        locator_kind: {type: string, enum: [pdf_page, word_fragment, image_page, json_fragment, unknown]}
        index: {type: integer, minimum: 1}
        declared_block:
          type: [integer, 'null']
          minimum: 1
          description: 原候选的块序声明，尚未经精确区间验证。
    QuestionProvenance:
      type: object
      additionalProperties: false
      description: 此题目版本的导入来源快照。原文件仍按临时任务期限管理，本记录仅有元数据；来源声明不等于版权审校或精确引文。
      required: [source_snapshot, origins, relation, parent_version, access]
      properties:
        source_snapshot: {$ref: '#/components/schemas/QuestionSource'}
        origins:
          type: array
          maxItems: 2000
          items: {$ref: '#/components/schemas/QuestionOriginLocation'}
        relation: {type: string, enum: [declared, derived_unverified]}
        parent_version: {type: [integer, 'null'], minimum: 1}
        access: {type: string, enum: [metadata_only]}
    QuestionSource:
      type: object
      additionalProperties: false
      required: [source_type, source_category, source_name, source_year, source_license, source_url, is_engineering_sample, label]
      properties:
        source_type: {$ref: '#/components/schemas/SourceType'}
        source_category: {$ref: '#/components/schemas/SourceCategory'}
        source_name: {type: [string, 'null']}
        source_year: {type: [integer, 'null']}
        source_license: {type: string}
        source_url: {type: [string, 'null']}
        is_engineering_sample: {type: boolean, description: 自编工程样题，未经学科审校。}
        label: {type: string}
    KnowledgeRef:
      type: object
      additionalProperties: false
      required: [id, code, title]
      properties:
        id: {type: string, format: uuid}
        code: {type: string}
        title: {type: string}
    QuestionOption:
      type: object
      additionalProperties: false
      required: [key, text]
      properties:
        key: {type: string, minLength: 1, maxLength: 8}
        text: {type: string, maxLength: 4000}
    QuestionBlank:
      type: object
      additionalProperties: false
      required: [key, label, unit_hint, placeholder]
      properties:
        key: {type: string, minLength: 1, maxLength: 16}
        label: {type: [string, 'null']}
        unit_hint: {type: [string, 'null'], description: 提示是否需要带单位。}
        placeholder: {type: [string, 'null']}
    QuestionAttachment:
      type: object
      additionalProperties: false
      required: [kind, media_id, alt]
      properties:
        kind: {type: string, enum: [image, table]}
        media_id: {type: [string, 'null'], format: uuid}
        alt: {type: string}
    Subquestion:
      type: object
      additionalProperties: false
      required: [key, stem, answer_mode, options, blanks]
      properties:
        key: {type: string}
        stem: {type: string, maxLength: 4000}
        answer_mode: {$ref: '#/components/schemas/AnswerMode'}
        options:
          type: array
          maxItems: 12
          items: {$ref: '#/components/schemas/QuestionOption'}
        blanks:
          type: array
          maxItems: 12
          items: {$ref: '#/components/schemas/QuestionBlank'}
    ExperimentSafetyLevel:
      type: string
      description: |
        实验的风险分级。low 只涉及常规的低风险操作；medium 需要提醒防护措施；
        high（高风险）现在不收录：还没有专项审核流程，程序校验会拦住它，不会发给学生。
      enum: [low, medium, high]
    ExperimentSafety:
      type: object
      additionalProperties: false
      description: |
        实验安全提示。每道实验题都必须有，上线前由审核员逐条确认。
        这是纸面练习，不是操作指导：题目、提示和解法都不给现实操作的步骤诱导。
      required: [level, notes]
      properties:
        level: {$ref: '#/components/schemas/ExperimentSafetyLevel'}
        notes:
          type: array
          minItems: 1
          maxItems: 8
          items: {type: string, minLength: 1, maxLength: 200}
    DataTableColumn:
      type: object
      additionalProperties: false
      required: [key, label, unit]
      properties:
        key: {type: string, minLength: 1, maxLength: 16, pattern: '^[A-Za-z0-9_]+$'}
        label: {type: string, minLength: 1, maxLength: 40}
        unit: {type: [string, 'null'], maxLength: 16}
    DataTableCell:
      type: object
      additionalProperties: false
      required: [col, text]
      properties:
        col: {type: string, minLength: 1, maxLength: 16, description: '所在列的键，对应 columns[].key。'}
        text:
          type: [string, 'null']
          maxLength: 40
          description: |
            题目给出的数据；null 表示留空，由学生填写（参考值只在提交之后随自查给出）。
            字段不叫 value：题目接口里不允许出现名为 value 的键，答案类的字段都叫这个名字。
    DataTableRow:
      type: object
      additionalProperties: false
      required: [key, label, cells]
      properties:
        key: {type: string, minLength: 1, maxLength: 16, pattern: '^[A-Za-z0-9_]+$'}
        label: {type: [string, 'null'], maxLength: 40}
        cells:
          type: array
          minItems: 1
          maxItems: 12
          items: {$ref: '#/components/schemas/DataTableCell'}
    DataTable:
      type: object
      additionalProperties: false
      description: 实验题的数据表。格子由 (表键, 行键, 列键) 唯一确定；text 为 null 的格子由学生填写。
      required: [key, title, columns, rows]
      properties:
        key: {type: string, minLength: 1, maxLength: 16, pattern: '^[A-Za-z0-9_]+$'}
        title: {type: string, minLength: 1, maxLength: 120}
        columns:
          type: array
          minItems: 1
          maxItems: 12
          items: {$ref: '#/components/schemas/DataTableColumn'}
        rows:
          type: array
          minItems: 1
          maxItems: 30
          items: {$ref: '#/components/schemas/DataTableRow'}
    ProofStatement:
      type: object
      additionalProperties: false
      description: |
        证明题的"已知"和"求证"。参考证明不在这里，只在提交之后随自查（`SelfCheck.reference_steps`）给出。
      required: [givens, claim]
      properties:
        givens:
          type: array
          maxItems: 8
          description: 已知条件，界面上编号成 ①②③，学生写依据时可以引用；题干里已经写全了已知条件时为空数组。
          items: {type: string, minLength: 1, maxLength: 400}
        claim: {type: string, minLength: 1, maxLength: 500, description: 求证的结论。}
    QuestionContent:
      type: object
      additionalProperties: false
      required: [stem, options, blanks, subquestions, attachments, data_tables, safety, proof]
      properties:
        stem: {type: string, maxLength: 4000, description: 题干。纯文本，行内公式用 $...$ 包裹的 LaTeX。}
        options:
          type: array
          maxItems: 12
          items: {$ref: '#/components/schemas/QuestionOption'}
        blanks:
          type: array
          maxItems: 12
          items: {$ref: '#/components/schemas/QuestionBlank'}
        subquestions:
          type: array
          maxItems: 20
          items: {$ref: '#/components/schemas/Subquestion'}
        attachments:
          type: array
          maxItems: 20
          items: {$ref: '#/components/schemas/QuestionAttachment'}
        data_tables:
          type: array
          maxItems: 5
          description: 实验题的数据表；其他题型为空数组。
          items: {$ref: '#/components/schemas/DataTable'}
        safety:
          description: 实验题的安全提示；其他题型为 null。
          oneOf:
            - {$ref: '#/components/schemas/ExperimentSafety'}
            - {type: 'null'}
        proof:
          description: 证明题的已知和求证；其他题型为 null。
          oneOf:
            - {$ref: '#/components/schemas/ProofStatement'}
            - {type: 'null'}
    QuestionAssists:
      type: object
      additionalProperties: false
      required: [hint_levels, has_standard_solution, has_fast_solution, visual_available]
      properties:
        hint_levels: {type: integer, minimum: 0}
        has_standard_solution: {type: boolean}
        has_fast_solution: {type: boolean, description: 仅当存在带适用条件且审核过的快速解法时为 true。}
        visual_available: {type: boolean}
    QuestionSummary:
      type: object
      additionalProperties: false
      required: [id, subject, type, answer_mode, difficulty, title, source, applicability, knowledge, variant_of]
      properties:
        id: {type: string, format: uuid}
        subject: {$ref: '#/components/schemas/Subject'}
        type: {$ref: '#/components/schemas/QuestionType'}
        answer_mode: {$ref: '#/components/schemas/AnswerMode'}
        difficulty: {type: integer, minimum: 1, maximum: 5}
        title: {type: string}
        source: {$ref: '#/components/schemas/QuestionSource'}
        applicability: {$ref: '#/components/schemas/Applicability'}
        knowledge:
          type: array
          items: {$ref: '#/components/schemas/KnowledgeRef'}
        variant_of: {type: [string, 'null'], format: uuid}
    Question:
      type: object
      additionalProperties: false
      required:
        - id
        - subject
        - type
        - answer_mode
        - difficulty
        - title
        - source
        - applicability
        - knowledge
        - variant_of
        - version
        - grade
        - content
        - assists
        - judging_note
      properties:
        provenance:
          description: 当前响应所指固定题目版本的来源快照；旧数据或无可靠导入记录为null，不从当前题目或相似文字推造旧来源。
          oneOf:
            - {$ref: '#/components/schemas/QuestionProvenance'}
            - {type: 'null'}
        id: {type: string, format: uuid}
        subject: {$ref: '#/components/schemas/Subject'}
        type: {$ref: '#/components/schemas/QuestionType'}
        answer_mode: {$ref: '#/components/schemas/AnswerMode'}
        difficulty: {type: integer, minimum: 1, maximum: 5}
        title: {type: string}
        source: {$ref: '#/components/schemas/QuestionSource'}
        applicability: {$ref: '#/components/schemas/Applicability'}
        knowledge:
          type: array
          items: {$ref: '#/components/schemas/KnowledgeRef'}
        variant_of: {type: [string, 'null'], format: uuid}
        version: {type: integer, minimum: 1}
        grade:
          oneOf:
            - {$ref: '#/components/schemas/Grade'}
            - {type: 'null'}
        content: {$ref: '#/components/schemas/QuestionContent'}
        assists: {$ref: '#/components/schemas/QuestionAssists'}
        judging_note: {type: [string, 'null'], description: 判定规则说明，例如多选题的判定方式。}
    QuestionPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/QuestionSummary'}
        next_cursor: {type: [string, 'null']}

    # ------------------------------------------------------------ 会话
    SessionCreate:
      type: object
      additionalProperties: false
      required: [question_id, origin]
      properties:
        question_id: {type: string, format: uuid}
        expected_question_version:
          type: integer
          minimum: 1
          description: 本机草稿依据的题面版本；不接受null。不匹配当前可提供的已发布版本时409，不自动关联新版。
        origin: {$ref: '#/components/schemas/SessionOrigin'}
        review_item_id: {type: [string, 'null'], format: uuid, description: origin=review 时必填。}
        parent_session_id: {type: [string, 'null'], format: uuid, description: origin=variant 时指向母题会话。}
    StudySession:
      type: object
      additionalProperties: false
      required:
        - id
        - question_id
        - question_version
        - origin
        - state
        - review_item_id
        - parent_session_id
        - region_code_snapshot
        - exam_year_snapshot
        - curriculum_version_snapshot
        - assisted
        - used_solution
        - independent_ended
        - hint_level_revealed
        - hint_levels_total
        - confused_streak
        - needs_human_help
        - active_attempt_id
        - submitted_attempts
        - last_event_seq
        - created_at
        - updated_at
      properties:
        id: {type: string, format: uuid}
        question_id: {type: string, format: uuid}
        question_version: {type: integer, minimum: 1, description: 开启会话时的题目版本快照。}
        origin: {$ref: '#/components/schemas/SessionOrigin'}
        state: {$ref: '#/components/schemas/SessionState'}
        review_item_id: {type: [string, 'null'], format: uuid}
        parent_session_id: {type: [string, 'null'], format: uuid}
        region_code_snapshot: {type: [string, 'null'], description: 学习时的地区快照，切换地区后不变。}
        exam_year_snapshot: {type: [integer, 'null']}
        curriculum_version_snapshot: {type: [string, 'null']}
        assisted: {type: boolean, description: 本会话已使用过提示、图解、换种讲法或解析。}
        used_solution: {type: boolean, description: 本会话已查看过常规或快速解法。}
        independent_ended: {type: boolean, description: 学生已明确结束独立作答。}
        hint_level_revealed: {type: integer, minimum: 0}
        hint_levels_total: {type: integer, minimum: 0}
        confused_streak: {type: integer, minimum: 0}
        needs_human_help: {type: boolean}
        active_attempt_id: {type: [string, 'null'], format: uuid, description: 最早创建的未提交草稿；客户端恢复时优先显式attempt_id或本机记录，不用此默认值覆盖另一副本。}
        first_submitted_attempt_id:
          type: [string, 'null']
          format: uuid
          description: 实际已提交且submission_no=1的作答ID；没有提交时null。可用于明确观察其他设备的首次提交，不能作为某个本机submit intent已成功的证明。旧回执可省略本字段，不能按attempt_no或active_attempt_id猜测。
        submitted_attempts: {type: integer, minimum: 0}
        last_event_seq: {type: integer, minimum: 0}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    # ------------------------------------------------------------ 作答
    AttemptCreate:
      type: object
      additionalProperties: false
      required: [session_id]
      properties:
        session_id: {type: string, format: uuid}
    AnswerBlank:
      type: object
      additionalProperties: false
      required: [key, value]
      properties:
        key: {type: string, minLength: 1, maxLength: 16}
        value: {type: string, maxLength: 200}
    AnswerCell:
      type: object
      additionalProperties: false
      description: 实验题数据表里的一个格子：学生填写的数（作答），或提交之后给出的参考值（自查）。
      required: [table, row, col, value]
      properties:
        table: {type: string, minLength: 1, maxLength: 16, description: '数据表的键，对应 content.data_tables[].key。'}
        row: {type: string, minLength: 1, maxLength: 16, description: '行键，对应 rows[].key。'}
        col: {type: string, minLength: 1, maxLength: 16, description: '列键，对应 columns[].key。'}
        value: {type: string, maxLength: 40}
    AnswerPart:
      type: object
      additionalProperties: false
      description: 解答题、实验题某一小问的文字作答。
      required: [key, text]
      properties:
        key: {type: string, minLength: 1, maxLength: 16, description: '小问键，对应题目 content.subquestions 里的 key。'}
        text: {type: string, maxLength: 4000}
    AnswerStep:
      type: object
      additionalProperties: false
      description: |
        证明题作答里的一步。依据可以不写：写不写、写得对不对都不拦提交，也不判对错，只是自查清单里会问。
      required: [text, reason]
      properties:
        text: {type: string, maxLength: 1000, description: 这一步写了什么、推出了什么。}
        reason: {type: string, maxLength: 400, description: 依据：定义、定理、已知条件或前面的某一步。}
    AnswerPayload:
      type: object
      additionalProperties: false
      description: |
        按题目的 answer_mode 填写对应字段：选择题用 selected_options，填空题用 blanks，解答题用 parts，
        实验题用 cells（数据表里留空的格子）和 parts（文字小问），证明题用 steps（一步一步的证明）。
        解答题、实验题、证明题可以只写一部分，也可以只有笔迹（笔迹随草稿同步，不在这里）；
        文字、格子、步骤和笔迹都没有时提交返回 422。
      properties:
        selected_options:
          type: array
          maxItems: 10
          uniqueItems: true
          items: {type: string, minLength: 1, maxLength: 8}
        blanks:
          type: array
          maxItems: 10
          items: {$ref: '#/components/schemas/AnswerBlank'}
        parts:
          type: array
          maxItems: 20
          items: {$ref: '#/components/schemas/AnswerPart'}
        cells:
          type: array
          maxItems: 200
          description: 实验题数据表里学生填写的格子；只能是题目留空的格子，同一个格子只能填一次。
          items: {$ref: '#/components/schemas/AnswerCell'}
        steps:
          type: array
          maxItems: 30
          description: 证明题里学生写的证明，一步一项，列表的顺序就是证明的顺序。
          items: {$ref: '#/components/schemas/AnswerStep'}
        text: {type: [string, 'null'], maxLength: 4000}
    Stroke:
      type: object
      additionalProperties: false
      required: [color, width, points]
      properties:
        color: {type: string, pattern: '^#[0-9A-Fa-f]{6}$'}
        width: {type: number, minimum: 0.5, maximum: 24}
        points:
          type: array
          description: 扁平数组，每 4 个数为一个采样点：x、y（页面逻辑坐标）、t（距笔画起点的毫秒数）、p（压力 0~1，取不到时为 0.5）。
          maxItems: 40000
          items: {type: number}
    StrokePage:
      type: object
      additionalProperties: false
      required: [width, height, strokes]
      properties:
        width: {type: number, exclusiveMinimum: 0, maximum: 10000}
        height: {type: number, exclusiveMinimum: 0, maximum: 10000}
        strokes:
          type: array
          maxItems: 3000
          items: {$ref: '#/components/schemas/Stroke'}
    StrokeDoc:
      type: object
      additionalProperties: false
      required: [version, pages]
      properties:
        version: {type: integer, enum: [1]}
        pages:
          type: array
          maxItems: 20
          items: {$ref: '#/components/schemas/StrokePage'}
    Draft:
      type: object
      additionalProperties: false
      required: [attempt_id, revision, answer, strokes, updated_at]
      properties:
        attempt_id: {type: string, format: uuid}
        revision: {type: integer, minimum: 0, description: 单调递增；0 表示尚未同步过。}
        answer:
          oneOf:
            - {$ref: '#/components/schemas/AnswerPayload'}
            - {type: 'null'}
        strokes:
          oneOf:
            - {$ref: '#/components/schemas/StrokeDoc'}
            - {type: 'null'}
        updated_at: {type: string, format: date-time}
    DraftSync:
      type: object
      additionalProperties: false
      required: [base_revision]
      properties:
        base_revision: {type: integer, minimum: 0}
        answer:
          oneOf:
            - {$ref: '#/components/schemas/AnswerPayload'}
            - {type: 'null'}
        strokes:
          oneOf:
            - {$ref: '#/components/schemas/StrokeDoc'}
            - {type: 'null'}
    SubmitRequest:
      type: object
      additionalProperties: false
      required: [answer]
      properties:
        answer: {$ref: '#/components/schemas/AnswerPayload'}
        elapsed_ms: {type: [integer, 'null'], minimum: 0}
        expected_draft_revision:
          type: integer
          minimum: 0
          description: 提交所依据的已同步草稿版本，非null严格整数；缺省兼容旧客户端。防止冻结答案与后来变动的笔迹混合。
    FeedbackItem:
      type: object
      additionalProperties: false
      required: [target, code, message]
      properties:
        target: {type: string, description: 选项键、空位键或 overall。}
        code: {$ref: '#/components/schemas/FeedbackCode'}
        message: {type: string}
    Evaluation:
      type: object
      additionalProperties: false
      required: [state, outcome, is_correct, independent, assisted, used_solution, review_required, feedback, message, disclaimer]
      properties:
        state: {$ref: '#/components/schemas/EvaluationState'}
        outcome: {$ref: '#/components/schemas/EvaluationOutcome'}
        is_correct: {type: [boolean, 'null'], description: 仅 state=verified 时非 null；完全正确才为 true。}
        independent: {type: boolean}
        assisted: {type: boolean}
        used_solution: {type: boolean}
        review_required: {type: boolean, description: 需要人工复核或学生确认。}
        feedback:
          type: array
          items: {$ref: '#/components/schemas/FeedbackItem'}
        message: {type: string}
        disclaimer: {type: string, description: 说明这是练习反馈而非官方阅卷分数。}
    Attempt:
      type: object
      additionalProperties: false
      required:
        - id
        - session_id
        - attempt_no
        - status
        - answer
        - draft_revision
        - assisted
        - used_solution
        - independent
        - evaluation
        - submitted_at
        - created_at
        - updated_at
      properties:
        id: {type: string, format: uuid}
        session_id: {type: string, format: uuid}
        attempt_no: {type: integer, minimum: 1, description: 同会话作答的创建顺序；不代表实际提交顺序。}
        submission_no: {type: [integer, 'null'], minimum: 1, description: 同会话实际提交顺序；草稿为null。可选以兼容历史幂等回执。}
        copied_from_attempt_id: {type: [string, 'null'], format: uuid, description: 明确创建副本时的源作答；普通作答为null。}
        copied_from_revision: {type: [integer, 'null'], minimum: 0, description: 创建副本时校验的源草稿revision。}
        status: {$ref: '#/components/schemas/AttemptStatus'}
        answer:
          oneOf:
            - {$ref: '#/components/schemas/AnswerPayload'}
            - {type: 'null'}
        draft_revision: {type: integer, minimum: 0}
        assisted: {type: boolean}
        used_solution: {type: boolean}
        independent: {type: [boolean, 'null'], description: 提交后才确定。}
        evaluation:
          oneOf:
            - {$ref: '#/components/schemas/Evaluation'}
            - {type: 'null'}
        submitted_at: {type: [string, 'null'], format: date-time}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    DraftCopyCreate:
      type: object
      additionalProperties: false
      required: [source_revision, answer, strokes]
