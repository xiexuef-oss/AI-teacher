    ScanConfirm:
      type: object
      additionalProperties: false
      required: [stem_text, expressions]
      properties:
        stem_text: {type: string, minLength: 1, maxLength: 4000}
        expressions:
          type: array
          maxItems: 50
          items: {$ref: '#/components/schemas/ScanExpression'}
    ScanConfirmation:
      type: object
      additionalProperties: false
      required: [scan, question_id, draft_question_id]
      properties:
        scan: {$ref: '#/components/schemas/Scan'}
        question_id: {type: [string, 'null'], format: uuid, description: 匹配到的已发布题。}
        draft_question_id: {type: [string, 'null'], format: uuid, description: 本地Mock始终为null，不创建题库草稿。}

    # ------------------------------------------------------------ 家长：授权绑定与周报
    ParentInvite:
      type: object
      additionalProperties: false
      description: 学生生成的一次性邀请码。`code` 只在创建时出现这一次，之后任何接口都不会再返回它。
      required: [id, code, created_at, expires_at]
      properties:
        parent_invite_revision: {type: integer, minimum: 0, description: 新服务始终返回；旧缓存或旧回执缺失表示未知，不能补默认版本。}
        id: {type: string, format: uuid}
        code: {type: string, minLength: 10, maxLength: 10, description: 十位，字母和数字；念给家长或写给家长看，不分大小写。}
        created_at: {type: string, format: date-time, description: 学生明确授权的时间。}
        expires_at: {type: string, format: date-time}
    ParentInviteCreate:
      type: object
      additionalProperties: false
      required: [expected_parent_invite_revision]
      properties:
        expected_parent_invite_revision: {type: integer, minimum: 0}
    ParentLinkRevoke:
      type: object
      additionalProperties: false
      required: [expected_authorization_revision]
      properties:
        expected_authorization_revision: {type: integer, minimum: 1}
    ParentInviteRedeem:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: {type: string, minLength: 1, maxLength: 40, description: 学生给的邀请码；空格、短横线和大小写会被忽略。}
    PendingParentInvite:
      type: object
      additionalProperties: false
      description: 一个还没被使用、也没过期的邀请码。这里看不到码本身。
      required: [id, created_at, expires_at]
      properties:
        id: {type: string, format: uuid}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
    ParentLink:
      type: object
      additionalProperties: false
      description: 学生对一位家长的授权。
      required: [id, parent_id, parent_label, consent_at, linked_at, revoked_at]
      properties:
        authorization_revision: {type: integer, minimum: 1, description: 新服务始终返回；旧缓存或旧回执缺失表示未知，不能补默认版本。}
        id: {type: string, format: uuid}
        parent_id: {type: string, format: uuid}
        parent_label: {type: [string, 'null'], description: 家长的称呼；没有设置时为 null。}
        consent_at: {type: string, format: date-time, description: 学生明确授权的时间（生成这个邀请码的时间）。}
        linked_at: {type: string, format: date-time, description: 家长输入邀请码、绑定完成的时间。}
        revoked_at: {type: [string, 'null'], format: date-time, description: 撤销的时间；仍然有效时为 null。}
    ParentLinks:
      type: object
      additionalProperties: false
      required: [links, pending_invite]
      properties:
        parent_invite_revision: {type: integer, minimum: 0, description: 新服务始终返回；旧缓存或旧回执缺失表示未知，不能补默认版本。}
        links:
          type: array
          description: 现在仍然有效的授权。
          items: {$ref: '#/components/schemas/ParentLink'}
        pending_invite:
          description: 还没被使用、也没过期的邀请码；没有时为 null。
          oneOf:
            - {$ref: '#/components/schemas/PendingParentInvite'}
            - {type: 'null'}
    ParentStudent:
      type: object
      additionalProperties: false
      description: 家长能看的一位学生。
      required: [student_id, display_name, linked_at]
      properties:
        student_id: {type: string, format: uuid}
        display_name: {type: [string, 'null'], description: 学生自己设置的称呼；没有设置时为 null。}
        linked_at: {type: string, format: date-time}
    ParentStudents:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ParentStudent'}
    WeeklyTrend:
      type: string
      description: 独立正确率和上一周比：up 高了，down 低了，flat 差不多（差距不到 5 个百分点），unknown 两周里有一周样本不足。
      enum: [up, down, flat, unknown]
    PreviousWeek:
      type: object
      additionalProperties: false
      description: 上一周的几个数，用来看趋势。
      required: [week_start, attempts_count, independent]
      properties:
        week_start: {type: string, format: date}
        attempts_count: {type: integer, minimum: 0}
        independent: {$ref: '#/components/schemas/RateStat'}
    PaperWeeklySummary:
      type: object
      additionalProperties: false
      required: [confirmed, awaiting_assessment, late_returns, unknown_completion_date, independent, assisted]
      properties:
        confirmed: {type: integer, minimum: 0}
        awaiting_assessment: {type: integer, minimum: 0}
        late_returns: {type: integer, minimum: 0}
        unknown_completion_date: {type: integer, minimum: 0}
        independent: {$ref: '#/components/schemas/RateStat'}
        assisted: {$ref: '#/components/schemas/RateStat'}

    ParentWeeklySnapshot:
      type: object
      additionalProperties: false
      required: [revision, report]
      properties:
        revision: {type: integer, minimum: 1}
        report: {$ref: '#/components/schemas/ParentWeekly'}

    ParentWeekly:
      type: object
      additionalProperties: false
      description: |
        一位已授权学生某一周的汇总。只有计数和比例：没有具体题目、作答内容、提示原文、草稿和笔迹，
        也没有每次练习的时间。周从周一到周日，按服务端配置的时区划分。样本少于 `min_samples` 的比例是 null，只给计数。
        不是官方成绩，没有排名，也没有连续天数。
      required:
        - student_id
        - student_display_name
        - week_start
        - week_end
        - is_complete
        - generated_at
        - min_samples
        - sessions_count
        - attempts_count
        - active_days
        - independent
        - assisted
        - hint_dependency
        - retest_success
        - written_attempts
        - independent_trend
        - previous_week
        - by_subject
        - disclaimer
      properties:
        paper:
          oneOf:
            - {$ref: '#/components/schemas/PaperWeeklySummary'}
            - {type: 'null'}
        student_id: {type: string, format: uuid}
        student_display_name: {type: [string, 'null']}
        week_start: {type: string, format: date, description: 这一周的周一。}
        week_end: {type: string, format: date, description: 这一周的周日。}
        is_complete: {type: boolean, description: 这一周已经结束；当前这一周是 false。}
        generated_at: {type: string, format: date-time}
        min_samples: {type: integer, minimum: 1}
        sessions_count: {type: integer, minimum: 0, description: 这一周开始的练习次数。}
        attempts_count: {type: integer, minimum: 0, description: 这一周提交的作答数（含解答题、实验题和证明题）。}
        active_days: {type: integer, minimum: 0, maximum: 7, description: 这一周有几天提交过作答。只是个数，没有连续天数。}
        independent: {$ref: '#/components/schemas/RateStat'}
        assisted: {$ref: '#/components/schemas/RateStat'}
        hint_dependency: {$ref: '#/components/schemas/RateStat'}
        retest_success: {$ref: '#/components/schemas/RateStat'}
        written_attempts: {type: integer, minimum: 0, description: 这一周提交的解答题、实验题和证明题数（字段名沿用）。它们不自动评分，不进上面任何一个比例。}
        independent_trend: {$ref: '#/components/schemas/WeeklyTrend'}
        previous_week: {$ref: '#/components/schemas/PreviousWeek'}
        by_subject:
          type: array
          items: {$ref: '#/components/schemas/ProgressBucket'}
        disclaimer: {type: string}
    QuestionStatus:
      type: string
      description: docs/07 的审校状态。draft 编辑中；reviewed 已独立二审；published 已上线；withdrawn 因问题下线（终态）。
      enum: [draft, reviewed, published, withdrawn]
    ReviewDecisionType:
      type: string
      description: approve 二审通过；reject 退回修改（须写原因）；publish 上线；withdraw 下线（须写原因）。
      enum: [approve, reject, publish, withdraw]
    SolutionKind:
      type: string
      enum: [standard, fast]
    ReviewBatchItem:
      type: object
      additionalProperties: false
      required: [question_id, expected_version, expected_review_revision, decision, confirmed]
      properties:
        expected_review_revision:
          type: integer
          minimum: 1
