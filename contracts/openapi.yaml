          items: {$ref: '#/components/schemas/ExportModelCall'}
        budget_days:
          type: array
          items: {$ref: '#/components/schemas/ExportModelBudgetDay'}

    StudentLearningExport:
      type: object
      additionalProperties: false
      required: [format_version, scope, exported_at, profile, sessions, reviews, review_history, excluded]
      properties:
        model_usage:
          description: 新服务返回当前服务端伪名可关联的记录；旧文件缺少此字段表示未提供该范围，不代表没有调用。伪名由token身份在服务端派生，不接受客户端指定。
          $ref: '#/components/schemas/ExportModelUsage'
        parent_access_records:
          description: 新服务始终返回；旧文件缺失表示未包含此范围，不能解释为从未授权。
          $ref: '#/components/schemas/ExportParentAccessRecords'
        stored_scan_records:
          description: 本地环境返回本人仍保存的拍题文字记录（包括尚未清理的过期记录），不重建已清理历史；空数组仅表示当前无保存记录。受控环境不读取proto表并返回null；旧文件可能缺失，null或缺失均表示未提供此范围，不代表从未拍题。
          type: [array, 'null']
          items: {$ref: '#/components/schemas/ExportStoredScan'}
        diagnostic_runs:
          description: 本人全部摸底计划与首份提交计数，按开始时间及ID排序；新服务始终返回，旧导出缺失时表示未包含此范围。
          type: array
          items: {$ref: '#/components/schemas/DiagnosticRun'}
        diagnostic_workspace:
          description: 导出时本人的工作区版本及最近轮次；读取不创建记录。旧导出可能缺失。
          $ref: '#/components/schemas/DiagnosticWorkspace'
        format_version: {type: integer, enum: [1]}
        scope: {type: string, enum: [server_learning_records]}
        exported_at: {type: string, format: date-time}
        profile: {$ref: '#/components/schemas/StudentProfile'}
        sessions:
          type: array
          items: {$ref: '#/components/schemas/ExportLearningSession'}
        reviews:
          type: array
          items: {$ref: '#/components/schemas/ReviewItem'}
        review_history:
          type: array
          items: {$ref: '#/components/schemas/ExportReviewHistory'}
        excluded:
          type: array
          items: {type: string, enum: [auth_credentials, operational_logs, question_answer_keys, unsynced_device_data, media_files, guardian_authorizations]}

    ReviewState:
      type: object
      additionalProperties: false
      required: [id, question_id, status, stage, total_stages, due_at, last_result, last_attempt_id, updated_at]
      properties:
        id: {type: string, format: uuid}
        question_id: {type: string, format: uuid}
        status: {$ref: '#/components/schemas/ReviewStatus'}
        stage: {type: integer, minimum: 0}
        total_stages: {type: integer, minimum: 1}
        due_at: {type: string, format: date-time}
        last_result:
          oneOf:
            - {$ref: '#/components/schemas/ReviewResult'}
            - {type: 'null'}
        last_attempt_id: {type: [string, 'null'], format: uuid}
        updated_at: {type: string, format: date-time}
    ReviewPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ReviewItem'}
        next_cursor: {type: [string, 'null']}
    ReviewComplete:
      type: object
      additionalProperties: false
      required: [attempt_id]
      properties:
        attempt_id: {type: string, format: uuid}
    ReviewCompletion:
      type: object
      additionalProperties: false
      required: [review_item, result, next_due_at]
      properties:
        review_item: {$ref: '#/components/schemas/ReviewItem'}
        result: {$ref: '#/components/schemas/ReviewResult'}
        next_due_at: {type: [string, 'null'], format: date-time}

    # ------------------------------------------------------------ 学情
    RateStat:
      type: object
      additionalProperties: false
      required: [numerator, denominator, rate, insufficient_data]
      properties:
        numerator: {type: integer, minimum: 0}
        denominator: {type: integer, minimum: 0}
        rate: {type: [number, 'null'], minimum: 0, maximum: 1, description: 样本不足时为 null。}
        insufficient_data: {type: boolean}
    ProgressBucket:
      type: object
      additionalProperties: false
      required: [key, label, independent, assisted]
      properties:
        key: {type: string}
        label: {type: string}
        independent: {$ref: '#/components/schemas/RateStat'}
        assisted: {$ref: '#/components/schemas/RateStat'}
    SubjectiveProgress:
      type: object
      additionalProperties: false
      description: |
        解答题、实验题和证明题不自动评分，所以不进任何正确率。这里只数：提交了几份、其中自查了几份，
        以及自查里各档要点的个数（只统计已保存自查的作答）。这些都是学生自己的记录。
      required: [attempts, self_checked, points_done, points_partial, points_missed]
      properties:
        attempts: {type: integer, minimum: 0, description: 已提交的解答题、实验题和证明题作答数。}
        self_checked: {type: integer, minimum: 0, description: 其中保存了自查的作答数。}
        points_done: {type: integer, minimum: 0}
        points_partial: {type: integer, minimum: 0}
        points_missed: {type: integer, minimum: 0}
    ProgressSummary:
      type: object
      additionalProperties: false
      required:
        - generated_at
        - min_samples
        - independent
        - assisted
        - hint_dependency
        - retest_success
        - variant_transfer
        - uncertain_attempts
        - subjective
        - by_subject
        - by_answer_mode
        - by_difficulty
        - disclaimer
      properties:
        generated_at: {type: string, format: date-time}
        min_samples: {type: integer, minimum: 1}
        independent: {$ref: '#/components/schemas/RateStat'}
        assisted: {$ref: '#/components/schemas/RateStat'}
        hint_dependency: {$ref: '#/components/schemas/RateStat'}
        retest_success: {$ref: '#/components/schemas/RateStat'}
        variant_transfer: {$ref: '#/components/schemas/RateStat'}
        uncertain_attempts:
          type: integer
          minimum: 0
          description: 客观题里未能确定判定、因此没有计入任何正确率的提交数。解答题、实验题和证明题本来就不自动评分，不算在这里。
        subjective: {$ref: '#/components/schemas/SubjectiveProgress'}
        by_subject:
          type: array
          items: {$ref: '#/components/schemas/ProgressBucket'}
        by_answer_mode:
          type: array
          items: {$ref: '#/components/schemas/ProgressBucket'}
        by_difficulty:
          type: array
          items: {$ref: '#/components/schemas/ProgressBucket'}
        disclaimer: {type: string}

