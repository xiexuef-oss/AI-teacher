    QuestionDraftRef:
      type: object
      additionalProperties: false
      required: [session_id, attempt_id, question_version, attempt_no, draft_revision, copied_from_attempt_id, copied_from_revision, origin, review_item_id, session_state, updated_at]
      properties:
        session_id: {type: string, format: uuid}
        attempt_id: {type: string, format: uuid}
        question_version: {type: integer, minimum: 1}
        attempt_no: {type: integer, minimum: 1}
        draft_revision: {type: integer, minimum: 0}
        copied_from_attempt_id: {type: [string, 'null'], format: uuid}
        copied_from_revision: {type: [integer, 'null'], minimum: 0}
        origin: {$ref: '#/components/schemas/SessionOrigin'}
        review_item_id: {type: [string, 'null'], format: uuid}
