  /reviews/{review_id}/complete:
    post:
      operationId: completeReview
      tags: [reviews]
      summary: 用一次已判定的复测作答完成复测项
      description: |
        结果只取服务端对该作答的判定，不接受客户端自报。作答必须属于以该复测项开启的会话。
        实际采用该会话 submission_no=1 的已提交作答；请求所指的作答可以是同会话的未提交副本。
        通过（独立且正确）进入下一档间隔，全部通过后 `mastered`；未通过回到第一档。
        作答尚未判定或为 `uncertain` 时返回 409 `attempt_not_verified`。
        同一次实际首次提交只能完成该复测项一次，即使之后已完成其他轮次且再次到期，
        使用新幂等键重复完成仍返回 409 `review_already_completed`；原成功幂等键仍重放原结果。
        旧数据无法可靠确认完成历史时返回 409 `review_completion_history_unknown`，不推进阶段，
        不伪造历史结果。业务409不是本次命令成功，客户端应保留原作答并明确展示状态。
      x-implementation-status: implemented
      parameters:
        - {$ref: '#/components/parameters/RequestId'}
        - {$ref: '#/components/parameters/ReviewId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReviewComplete'}
      responses:
        '408': {$ref: '#/components/responses/RequestTimeout'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '429': {$ref: '#/components/responses/HttpRateLimited'}
        '200':
          description: 复测结果与下次安排
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
            Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/ReviewCompletion'}
        '400': {$ref: '#/components/responses/BadRequest'}
