openapi: 3.1.0
info:
  title: AI 理科私教 API
  version: 1.3.0-slice.1
  summary: 高中数学、物理、化学 AI 私教的公开 API 契约（权威文件）
  description: |
    约定（docs/05）：

    - Base 为 `/api/v1`；JSON UTF-8；时间一律 UTC ISO-8601；资源 ID 为 UUID。
    - 成功响应 `{"data": ...}`；错误响应 `{"error": {"code", "message", "details", "request_id"}}`，不返回栈信息。
    - 每个响应回显 `X-Request-Id`；请求未带时由服务端生成。
    - 非幂等动作必须带 `Idempotency-Key`。同键同请求重放首次的响应（带 `Idempotency-Replayed: true`）；
      同键不同请求返回 409 `idempotency_key_conflict`；缺少时返回 400 `idempotency_key_required`。
    - 权限只来自 Bearer token 与持久授权。请求里的任何 student_id 都不是授权依据；访问他人资源返回 404。
    - 删除或重命名字段是破坏性变更；新增字段默认可选，客户端忽略未知字段。
    - 原型期：服务端开启本地身份 Mock 时只接受回环地址的请求，其他来源的任何请求都在进入具体操作之前
      被拦截，返回 403 `loopback_only`（错误信封相同）。这是部署形态的限制，不逐个操作声明。
    - 可配置通用HTTP资源门控（默认关闭）：除GET /health外，超窗口/并发额度或共享限流不可用返回429
      `rate_limited`，请求体超字节上限返回413 `payload_too_large`，接收请求体超时返回408 `request_timeout`。
      这些拒绝在业务动作之前，不写业务或幂等回执；重试仍复用原幂等键。通用限流不替代邀请码专项或模型预算。

    `x-implementation-status`：`implemented` 表示 ADR-006 本地纵向切片已实现；`planned` 表示只定了契约草案，
    服务端目前返回 501 `not_implemented`，形状在实现前仍可调整。

    教学事件（`TutorEvent`）的 payload 由 `contracts/tutor_event.schema.json` 约束，服务端下发前逐个校验。

    练习反馈不是官方阅卷分数。判定不了的作答返回 `uncertain`，不算对也不算错。
servers:
  - url: /api/v1
tags:
  - {name: system, description: 健康检查与启动配置}
  - {name: identity, description: 本地身份 Mock（仅原型期，须显式开启）}
  - {name: profile, description: 学生资料与地区设置}
  - {name: tasks, description: 今日任务}
  - {name: questions, description: 题目}
  - {name: sessions, description: 学习会话与教学事件}
  - {name: attempts, description: 作答、草稿与提交}
  - {name: tutor, description: 教学下一步}
  - {name: reviews, description: 间隔复测}
  - {name: progress, description: 学情}
  - {name: media, description: 媒体上传与拍题（planned）}
  - {name: parents, description: 家长周报与绑定授权：学生明确授权、可撤销；家长只看汇总}
  - {name: admin, description: 内容审核（reviewer / admin）：题目 draft → reviewed → published，可撤回}
security:
  - bearerAuth: []

paths:
  /diagnostics:
    get:
      operationId: getDiagnosticWorkspace
      tags: [tasks]
      summary: 获取本人最近一轮三题摸底及恢复进度
      x-implementation-status: implemented
      parameters:
        - {$ref: '#/components/parameters/RequestId'}
      responses:
        '200':
          description: 本人当前工作区；无记录时run为null，revision为0。读取不创建记录。
          headers: {X-Request-Id: {$ref: '#/components/headers/RequestId'}}
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/DiagnosticWorkspace'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '408': {$ref: '#/components/responses/RequestTimeout'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '429': {$ref: '#/components/responses/HttpRateLimited'}
    post:
      operationId: createDiagnostic
      tags: [tasks]
      summary: 按本人资料创建一轮三题摸底
      description: |
        仅选择已发布、符合当前地区/年份及年级的非变式客观题；未知年级不推断。
        不足三题返回422，不扩大地区范围或混入主观题。未完成轮次须明确结束后才能另开。
        选题与资料快照固定；所有写操作必须提供工作区期望版本，成功后递增。
        工程样题保留原标签，不代表经过学科审校或已验证教学有效性。
      x-implementation-status: implemented
      parameters:
        - {$ref: '#/components/parameters/RequestId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DiagnosticCreate'}
      responses:
        '201':
          description: 创建成功；幂等重放返回原始工作区，不代表最新进度。
          headers: {X-Request-Id: {$ref: '#/components/headers/RequestId'}}
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/DiagnosticWorkspace'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '408': {$ref: '#/components/responses/RequestTimeout'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '429': {$ref: '#/components/responses/HttpRateLimited'}

  /diagnostics/history:
    get:
      operationId: listDiagnosticHistory
      tags: [tasks]
      summary: 按开始时间倒序分页回看本人摸底轮次
      description: 游标是上一页最后一轮的ID，仅用于定位本人不可变的开始时间和ID，不作为授权。其他学生和不存在的游标统一返回400。结束轮次不删除历史；列表不含答案、提示或笔迹。
      x-implementation-status: implemented
      parameters:
        - {$ref: '#/components/parameters/RequestId'}
        - {name: cursor, in: query, required: false, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: 本人的历史页，包含进行中、完成及主动结束的轮次；无后续页时next_cursor为null。
          headers: {X-Request-Id: {$ref: '#/components/headers/RequestId'}}
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/DiagnosticHistoryPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '408': {$ref: '#/components/responses/RequestTimeout'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '429': {$ref: '#/components/responses/HttpRateLimited'}

  /diagnostics/{diagnostic_id}:
    get:
      operationId: getDiagnostic
      tags: [tasks]
      summary: 回看本人固定轮次及首份提交的本轮计数
      x-implementation-status: implemented
      parameters:
        - {$ref: '#/components/parameters/RequestId'}
        - {name: diagnostic_id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: 固定题目摘要及本人进度；不含答案、解析、提示或笔迹。
          headers: {X-Request-Id: {$ref: '#/components/headers/RequestId'}}
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/DiagnosticRun'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '408': {$ref: '#/components/responses/RequestTimeout'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '429': {$ref: '#/components/responses/HttpRateLimited'}

  /diagnostics/{diagnostic_id}/items/{position}/session:
    post:
      operationId: openDiagnosticSession
      tags: [tasks]
      summary: 打开固定题目版本的作答会话，已打开时返回原会话
      description: 仅当前未主动结束的轮次可打开，已完成轮次可回看原会话。未绑定题目若已换版或资料已变更，返回409，保留轮次与旧稿，须明确结束后另开；不自动换题。提交、草稿与提示复用普通练习流程。
      x-implementation-status: implemented
      parameters:
        - {$ref: '#/components/parameters/RequestId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {name: diagnostic_id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: position, in: path, required: true, schema: {type: integer, minimum: 1, maximum: 3}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DiagnosticRevision'}
      responses:
        '200':
          description: 作答会话；新建绑定时工作区版本递增，已有绑定不递增。客户端随后刷新工作区。
          headers: {X-Request-Id: {$ref: '#/components/headers/RequestId'}}
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/StudySession'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '408': {$ref: '#/components/responses/RequestTimeout'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '429': {$ref: '#/components/responses/HttpRateLimited'}

  /diagnostics/{diagnostic_id}/abandon:
    post:
      operationId: abandonDiagnostic
      tags: [tasks]
      summary: 明确结束本人当前轮次，保留题目、会话及所有草稿
      x-implementation-status: implemented
      parameters:
        - {$ref: '#/components/parameters/RequestId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {name: diagnostic_id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DiagnosticRevision'}
      responses:
        '200':
          description: 结束后的工作区；旧轮次仍可按ID回看，已提交结果不被删除。
          headers: {X-Request-Id: {$ref: '#/components/headers/RequestId'}}
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/DiagnosticWorkspace'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '408': {$ref: '#/components/responses/RequestTimeout'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '429': {$ref: '#/components/responses/HttpRateLimited'}

  /health:
    get:
      operationId: getHealth
      tags: [system]
      summary: 服务健康状态与关键开关
      x-implementation-status: implemented
      security: []
      parameters:
        - {$ref: '#/components/parameters/RequestId'}
      responses:
        '200':
          description: 服务可用
          headers: {X-Request-Id: {$ref: '#/components/headers/RequestId'}}
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/Health'}

  /meta/launch-config:
    get:
      operationId: getLaunchConfig
      tags: [system]
      summary: 首发地区、年级、学科、教材选项与考试年份估算
      description: 引导页用。地区由用户手动选择，不根据定位推断；教材选项与省份无对应关系。
      x-implementation-status: implemented
      security: []
      parameters:
        - {$ref: '#/components/parameters/RequestId'}
      responses:
        '408': {$ref: '#/components/responses/RequestTimeout'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '429': {$ref: '#/components/responses/HttpRateLimited'}
        '200':
          description: 启动配置
          headers: {X-Request-Id: {$ref: '#/components/headers/RequestId'}}
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/LaunchConfig'}

  /dev/local-identities:
    post:
      operationId: createLocalIdentity
      tags: [identity]
      summary: 创建一个本地身份并返回随机 bearer
      description: |
        仅当服务端显式开启本地身份 Mock（且环境为 local）时可用，并且只接受回环地址的请求。
        未开启时返回 404。token 只在本响应中出现一次，服务端只保存哈希。真实登录接口另行冻结（Q-03）。
        默认创建学生；`role=reviewer` / `role=admin` 用来在本机联调内容审核后台，真实环境的角色由身份服务决定。
      x-implementation-status: implemented
      security: []
      parameters:
        - {$ref: '#/components/parameters/RequestId'}
        - name: role
          in: query
          required: false
          schema: {$ref: '#/components/schemas/LocalRole'}
      responses:
        '408': {$ref: '#/components/responses/RequestTimeout'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '429': {$ref: '#/components/responses/HttpRateLimited'}
        '201':
          description: 已创建
          headers: {X-Request-Id: {$ref: '#/components/headers/RequestId'}}
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/LocalIdentity'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}

  /profile/media-export:
    get:
      operationId: getStudentMediaExport
      tags: [profile]
      summary: 下载本人当前可访问学生用途媒体的ZIP档案
      description: |
        只根据学生token确定归属，不接受owner/student_id或筛选参数；家长和审核员403。
        仅含本人仍有效的ocr_source/handwriting用途，排除审核附件、过期/删除对象、凭据和内部存储信息。
        ZIP经JSON的archive_base64传输，含manifest.json和受控文件名；客户端校验大小/摘要后主动保存。
        未上传/尚待确认对象只保留状态说明，不伪造文件；已声明可读却读取失败时整次失败。
        不创建服务器导出文件，不清理/续期或修改记录。存储未启用或非local返回501，不以空档案替代范围不可用。
        不是完整历史、完整个人备份或S3跨对象一致快照；不重建已过期/清理图片。
        源扫描和档案字节超限整次413，存储故障或数据不一致503，不静默返回半份档案。
      x-implementation-status: implemented
      parameters:
        - {$ref: '#/components/parameters/RequestId'}
      responses:
        '200':
          description: 本人当前学生用途媒体ZIP及其完整性元数据；Cache-Control为no-store
          headers: {X-Request-Id: {$ref: '#/components/headers/RequestId'}}
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/StudentMediaExport'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '408': {$ref: '#/components/responses/RequestTimeout'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/HttpRateLimited'}
        '501': {$ref: '#/components/responses/NotImplemented'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /profile/learning-export:
    get:
      operationId: getStudentLearningExport
      tags: [profile]
      summary: 导出当前学生的服务端学习记录
      description: |
        只根据token确定当前学生，不接受student_id或筛选参数。只读JSON，禁止缓存，不创建导出文件。
        包含本人资料、全部已保存会话/作答/笔迹/自查/教学事件及复测历史，不绕过解析解锁门控。
        包含本人现存家长访问授权及邀请记录，不含邀请码、哈希或家长身份资料。
        重新授权会覆盖旧绑定时间，因此这些记录不是完整授权历史，也不是法定监护核验。
        不含登录凭据、运维日志、未解锁的题库答案、本机未同步数据或媒体文件。
        本地环境另含本人仍保存的拍题文字/状态及原图引用，不要求原图存活，不清理过期记录；不是完整拍题历史或图片备份。
        这是学习记录导出，不是完整个人数据请求或可导入备份；并发修改时不承诺跨表原子快照。
        超过服务端资源上限时整次返回413，不提供静默截断文件；家长及审核角色403。
      x-implementation-status: implemented
      parameters:
        - {$ref: '#/components/parameters/RequestId'}
      responses:
        '200':
          description: 当前学生的学习记录；Cache-Control为no-store
          headers: {X-Request-Id: {$ref: '#/components/headers/RequestId'}}
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/StudentLearningExport'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '408': {$ref: '#/components/responses/RequestTimeout'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/HttpRateLimited'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /profile:
    get:
      operationId: getProfile
      tags: [profile]
      summary: 当前学生的资料
      x-implementation-status: implemented
      parameters:
        - {$ref: '#/components/parameters/RequestId'}
      responses:
        '408': {$ref: '#/components/responses/RequestTimeout'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '429': {$ref: '#/components/responses/HttpRateLimited'}
        '200':
          description: 学生资料；尚未完成引导时 onboarding_completed 为 false
          headers: {X-Request-Id: {$ref: '#/components/headers/RequestId'}}
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/StudentProfile'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      operationId: updateProfile
      tags: [profile]
      summary: 保存地区、年级、学科、考试年份与教材版本
      description: |
        必须携带幂等键与 expected_revision；旧客户端缺键返回400、缺版本返回422。
        成功回执优先重放；新请求版本不匹配返回409 profile_revision_conflict，details含
        expected_revision、server_revision与本人server_profile，不覆盖任何一方。每次成功revision加一。
        整体替换可编辑字段。`exam_year` 省略或为 null 时：若此前由用户手动设置过则保留，否则按年级估算
        （学年以 9 月为起点）。教材版本可以为 null（暂不清楚）。切换地区不影响已产生的会话快照。
      x-implementation-status: implemented
      parameters:
        - {$ref: '#/components/parameters/RequestId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProfileUpdate'}
      responses:
        '408': {$ref: '#/components/responses/RequestTimeout'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '429': {$ref: '#/components/responses/HttpRateLimited'}
        '200':
          description: 保存后的资料
          headers: {X-Request-Id: {$ref: '#/components/headers/RequestId'}}
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/StudentProfile'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}

  /learning/packs:
    get:
      operationId: listLearningPacks
      x-implementation-status: implemented
      tags: [tasks]
      summary: 分页列出本人已发布的纸包
      parameters:
        - {name: after, in: query, schema: {type: string, format: uuid}}
      responses:
        '200':
